# Native Dragon editor background #181616, foreground #C5C9C5 and syntax palette are preserved.
# Python mappings follow the pinned Dragon theme and Tree-sitter roles; plain variable uses ui.fg, self uses special2 italic, and parameters use syn.parameter.
# Source keyword/comment italics and word-operator bold are retained; the single Spyder keyword slot follows Keyword rather than the separate bold Statement group.
# All six bracket depths repeat syn.punct; native Dragon defines no rainbow bracket cycle.
# Intentional Spyder adaptation: native waveBlue1/waveBlue2 popup/search/selection fills are replaced with dragonBlack4/dragonBlack5 to keep large backgrounds neutral.
# Qt-only semantic feedback ramps, matched/unmatched bracket fills, current-cell shading and help fills are explicit adaptations.
# Status bar, tabs, toolbar and tree use only the native Dragon charcoal background stages.
