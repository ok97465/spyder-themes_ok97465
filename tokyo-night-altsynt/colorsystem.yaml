---
# Reference: Avetis.tokyo-night 1.0.2, themes/tokyo-night-alt.json.
# https://github.com/AvetisDN/tokyo-dark-theme/blob/d075816a68955bffcb4dae9cf26a44538b7619a1/themes/tokyo-night-alt.json
# SHA-256: f0ec30823dff95e55f024f38ecc321fee15d24726825500fb9e8ed1363d6e0fb
# Exact native UI/token colors are retained, including the subdued comments.
# RGBA colors are composited over their native editor/sidebar background for Qt.
# Intermediate status ramps and variable-explorer fills are Spyder adaptations.
# Surface slots describe native roles and are not a brightness gradient.
# Python scopes follow VS Code's MagicPython/Pylance fallbacks: docstrings are
# strings, unresolved generic calls use editor.foreground, classes use blue,
# and semantic self/cls parameters use the source's orange italic parameter rule.
# Bracket hues are VS Code's built-in dark defaults; this theme doesn't override
# them. The screenshot's bracketPairColorization setting enables all three.
AltSurfaceDark:
  B10: '#1D1F2D'  # sideBar/statusBar/titleBar/editorWidget background
  B20: '#1A1B26'  # editor/input/gutter/active file tab background
  B30: '#15161F'  # panel background
  B40: '#222332'  # tab.inactiveBackground / tabsBackground
  B50: '#2E3347'  # menu border / list.focusBackground
  B60: '#414868'  # focusBorder / editorWidget.resizeBorder
  B70: '#C0CAF5'  # workbench/editor foreground
  B80: '#B7BCCF'  # active title-bar foreground
  B90: '#FFFFFF'  # active tab/status/list-selection foreground
  B100: '#919199'  # tab.inactiveForeground: white at 128/255 over B40
  B110: '#4A4E62'  # activityBar.inactiveForeground flattened over editor
  B120: '#181821'  # list hover/active selection background
  B130: '#282C3B'  # list.inactiveSelectionBackground
  B140: '#21232E'  # editor.inactiveSelectionBackground
  B150: '#202437'  # editor.lineHighlightBackground
  B160: '#C0CBEA'  # list.hoverForeground
  B170: '#3D5DA1'  # button.background
  B180: '#2F477B'  # button.hoverBackground
  B190: '#323B5E'  # menu.selectionBackground
  B200: '#303039'  # scrollbarSlider.background over editor
  B210: '#3F3F45'  # scrollbarSlider.hoverBackground over editor
  B220: '#5C5D63'  # scrollbarSlider.activeBackground over editor
  B230: '#6E7084'  # titleBar.inactiveForeground
  B240: '#484B5C'  # editorLineNumber.foreground
  B250: '#F7768E'  # tab.activeBorderTop / progressBar.background
  B260: '#8F97B9'  # list.inactiveSelectionForeground (#C0CAF5AD) over #282C3B.
