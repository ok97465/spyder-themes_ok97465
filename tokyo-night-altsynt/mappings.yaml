---
# Avetis Tokyo Night AltSynt 1.0.2, pinned in theme.yaml.
# Standard Spyder roles provide a fallback; optional Python/UI roles preserve
# the source's native distinctions in the companion Spyder fork.
color_classes:
  Primary: AltSurfaceDark
  Secondary: AltBlue
  Tertiary: AltCyan
  Quaternary: AltBlue
  Success: AltSuccess
  Error: AltError
  Warning: AltWarning
  SurfaceDark: AltSurfaceDark
  AccentDark: AltAccentsDark
  GroupDark: AltGroupsDark
  Syntax: AltSyntaxDark
  Python: AltPythonDark
  HelpDark: AltHelpDark
  Logos: Logos
semantic_mappings:
  dark:
    COLOR_BACKGROUND_1: SurfaceDark.B10
    COLOR_BACKGROUND_2: SurfaceDark.B30
    COLOR_BACKGROUND_3: SurfaceDark.B40
    COLOR_BACKGROUND_4: SurfaceDark.B40
    COLOR_BACKGROUND_5: SurfaceDark.B20
    COLOR_BACKGROUND_6: SurfaceDark.B220
    COLOR_TEXT_1: SurfaceDark.B70
    COLOR_TEXT_2: SurfaceDark.B80
    COLOR_TEXT_3: SurfaceDark.B80
    COLOR_TEXT_4: SurfaceDark.B100
    COLOR_ACCENT_1: AccentDark.B10
