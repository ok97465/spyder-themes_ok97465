    PYTHON_LOGO_DOWN: Logos.B20
    SPYDER_LOGO_BACKGROUND: SurfaceDark.B20
    SPYDER_LOGO_WEB: SurfaceDark.B70
    SPYDER_LOGO_SNAKE: SurfaceDark.B70
    SPECIAL_TABS_SEPARATOR: SurfaceDark.B20
    SPECIAL_TABS_SELECTED: SurfaceDark.B20
    COLOR_HEART: SurfaceDark.B250
    TIP_TITLE_COLOR: AccentDark.B60
    TIP_CHAR_HIGHLIGHT_COLOR: Python.B10
    OPACITY_TOOLTIP: 230
css_overrides:
  --header-bg-color: HelpDark.B10
  --header-text-color: HelpDark.B20
  --syn-error-bg: HelpDark.B30
  --warning-bg: HelpDark.B40
  --link-color: AccentDark.B50
