    COLOR_TAB_SELECTED_ACCENT: SurfaceDark.B250
    COLOR_TAB_TEXT: SurfaceDark.B100
    COLOR_TAB_HOVER_BACKGROUND: SurfaceDark.B40
    COLOR_TREE_HOVER_BACKGROUND: SurfaceDark.B120
    COLOR_TREE_TEXT: SurfaceDark.B70
    COLOR_TREE_SELECTED_BACKGROUND: SurfaceDark.B120
    COLOR_TREE_SELECTED_TEXT: SurfaceDark.B90
    COLOR_TREE_INACTIVE_SELECTION_BACKGROUND: SurfaceDark.B130
    COLOR_TREE_INACTIVE_SELECTION_TEXT: SurfaceDark.B260
