    EDITOR_DEFINITION: [Syntax.B120, false, false]
    EDITOR_COMMENT: [Syntax.B130, false, false]
    EDITOR_STRING: [Syntax.B140, false, false]
    EDITOR_NUMBER: [Syntax.B150, false, false]
    EDITOR_INSTANCE: [Syntax.B160, false, true]
    EDITOR_SYMBOL: [Syntax.B170, false, false]
    EDITOR_OPERATOR: [Python.B10, false, false]
    EDITOR_WORD_OPERATOR: [Python.B10, false, false]
    EDITOR_PUNCTUATION: [Python.B20, false, false]
    EDITOR_SEPARATOR: [Python.B30, false, false]
    EDITOR_CLASS: [Python.B40, false, false]
    EDITOR_FUNCTION_CALL: [Python.B50, false, false]
    EDITOR_DOCSTRING: [Python.B60, false, false]
    EDITOR_TYPE: [Python.B70, false, false]
    EDITOR_BASECLASS: [Python.B80, false, false]
    EDITOR_STORAGE: [Python.B90, false, false]
    EDITOR_CONSTANT: [Python.B100, false, false]
    EDITOR_VARIABLE: [Python.B110, false, false]
    EDITOR_PARAMETER: [Python.B120, false, true]
    EDITOR_CLASS_REFERENCE: [Python.B130, false, false]
    EDITOR_BRACKET_1: [Python.B140, false, false]
    EDITOR_BRACKET_2: [Python.B150, false, false]
    EDITOR_BRACKET_3: [Python.B160, false, false]
    # Repeat the native three-color cycle (or unchanged punctuation) at depths 4-6.
    EDITOR_BRACKET_4: [Python.B140, false, false]
    EDITOR_BRACKET_5: [Python.B150, false, false]
    EDITOR_BRACKET_6: [Python.B160, false, false]
