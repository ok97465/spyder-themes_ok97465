# Adapted from Primer's official GitHub Dark theme (MIT).
# Upstream revision: cd78e5e4e7bcf132a6f428ae0f32264bb1b729cf
# https://github.com/primer/github-vscode-theme/blob/cd78e5e4e7bcf132a6f428ae0f32264bb1b729cf/src/theme.js
# https://github.com/primer/github-vscode-theme/blob/cd78e5e4e7bcf132a6f428ae0f32264bb1b729cf/src/colors.js
# Palette dependency: @primer/primitives 7.10.0 (the exact upstream version).
# Uses modern GitHub Dark Default, not the legacy GitHub Dark classic palette.
# Native editor background, foreground and syntax colors are preserved.
# Widget shade ramps and opaque alpha composites are adapted for Qt.
# Pinned theme.js SHA-256: a1fa66e9bb4b8fcf5ca8d627e5462d91b7a0187ee0ce99243d358824dc7c7256
# Python colors follow VS Code semantic fallback scopes, not just generic
# TextMate names: class -> entity.name.type.class (orange), parameter ->
# variable.parameter (orange), self/cls -> variable.parameter.function (normal),
# builtin class/type -> support.class (blue), unresolved generic calls -> normal.
# The pinned JS repeats editor.selectionBackground and inactiveSelectionBackground;
# its final high-contrast-only entries omit both keys in normal dark output.
# Native VS Code therefore supplies selection #264F78; opaque Qt selection is exact.
# All six native bracket colors are preserved in their source order.
# Python keyword.operator.logical inherits the native generic keyword red.
# Punctuation/docstrings use normal/string colors; there are no Python italics/bold.
# Qt-only feedback shade ramps and group/help fills remain explicit adaptations.
