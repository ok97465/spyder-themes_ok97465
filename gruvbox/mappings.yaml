---
# Upstream semantic reference (not a claim of exact native UI reproduction):
# https://github.com/morhetz/gruvbox/blob/ef8864bb42bf244f0295d1c5a403b27e3d139695/colors/gruvbox.vim
# Retain the personal Spyder dark/light backgrounds, functions and string colors.
# New roles distinguish neutral punctuation, yellow types, aqua bases and purple
# booleans. Dark keywords use the upstream bright red to remain legible.
# Builtin blue and function green remain deliberate personal adaptations.
# All six bracket slots deliberately use one neutral delimiter color.
color_classes:
  Primary: HumbleTranscendence
  Secondary: QuantumLushBamboo
  Tertiary: SluggishParadiso
  Quaternary: BalancedAster
  Success: IntractableFreshCutGrass
  Error: RadiantRedMist
  Warning: SluggishTigerKing
  Neutral: ExcitedJapaneseBonsai
  GroupDark: HappyHotspotDark
  GroupLight: HappyHotspotLight
  Syntax: GruvboxSyntaxDark
  SyntaxLight: GruvboxSyntaxLight
  PythonDark: OptionalPythonDark
  OptionalUIDark: OptionalUIDark
  PythonLight: OptionalPythonLight
  Logos: Logos
semantic_mappings:
  dark:

    # Explicit Qt chrome: preserve this Spyder adaptation, independently of editor.
    COLOR_TOOLBAR_BACKGROUND: Primary.B40
    COLOR_EDITOR_LINE_NUMBER: OptionalUIDark.B10
    COLOR_STATUSBAR_BACKGROUND: Primary.B40
    COLOR_STATUSBAR_TEXT: Primary.B130
    COLOR_TAB_TEXT: Primary.B130
    COLOR_TAB_SELECTED_TEXT: Primary.B150
    COLOR_TAB_SELECTED_BACKGROUND: Secondary.B50
    COLOR_TAB_SELECTED_ACCENT: Secondary.B70
    COLOR_TAB_HOVER_BACKGROUND: Primary.B30
    COLOR_TREE_TEXT: Primary.B130
    COLOR_TREE_HOVER_BACKGROUND: Primary.B30
    COLOR_TREE_SELECTED_BACKGROUND: Secondary.B60
    COLOR_TREE_SELECTED_TEXT: Primary.B150
    COLOR_TREE_INACTIVE_SELECTION_BACKGROUND: Primary.B30
    COLOR_TREE_INACTIVE_SELECTION_TEXT: Primary.B150
    TAB_SELECTED_ACCENT_INNER_EDGE: 1
    TAB_SELECTED_ACCENT_WIDTH: 3
    # Background colors
    COLOR_BACKGROUND_1: Primary.B10
    COLOR_BACKGROUND_2: Primary.B20
    COLOR_BACKGROUND_3: Primary.B30
    COLOR_BACKGROUND_4: Primary.B40
    COLOR_BACKGROUND_5: Primary.B50
    COLOR_BACKGROUND_6: Primary.B70

    # Text colors
    COLOR_TEXT_1: Primary.B130
    COLOR_TEXT_2: Primary.B120
    COLOR_TEXT_3: Primary.B110
    COLOR_TEXT_4: Primary.B100

    # Accent colors
    COLOR_ACCENT_1: Secondary.B50
    COLOR_ACCENT_2: Secondary.B60
    COLOR_ACCENT_3: Secondary.B70
    COLOR_ACCENT_4: Secondary.B80
    COLOR_ACCENT_5: Secondary.B100

    # Disabled elements
    COLOR_DISABLED: Primary.B70
    COLOR_EMPTY: Secondary.B70

    # Colors for information and feedback in dialogs
    COLOR_SUCCESS_1: Success.B100
    COLOR_SUCCESS_2: Success.B70
    COLOR_SUCCESS_3: Success.B90
    COLOR_SUCCESS_4: Success.B110
    COLOR_SUCCESS_5: Success.B130
    COLOR_ERROR_1: Error.B70
    COLOR_ERROR_2: Error.B80
    COLOR_ERROR_3: Error.B110
    COLOR_ERROR_4: Error.B120
    COLOR_ERROR_5: Error.B130
    COLOR_WARN_1: Warning.B80
    COLOR_WARN_2: Warning.B90
    COLOR_WARN_3: Warning.B100
    COLOR_WARN_4: Warning.B110
    COLOR_WARN_5: Warning.B120

    # Icon colors
    ICON_1: Primary.B130
    ICON_2: Tertiary.B100
    ICON_3: Success.B90
    ICON_4: Error.B80
    ICON_5: Warning.B80
    ICON_6: Primary.B30
    ICON_7: Quaternary.B100

    # Colors for variable explorer, and mixed uses of the color system
    GROUP_1: GroupDark.B10
    GROUP_2: GroupDark.B20
    GROUP_3: GroupDark.B30
    GROUP_4: GroupDark.B40
    GROUP_5: GroupDark.B50
    GROUP_6: GroupDark.B60
    GROUP_7: GroupDark.B70
    GROUP_8: GroupDark.B80
    GROUP_9: GroupDark.B90
    GROUP_10: GroupDark.B100
    GROUP_11: GroupDark.B110
    GROUP_12: GroupDark.B120

    # Colors for highlight in editor
    COLOR_HIGHLIGHT_1: Secondary.B10
    COLOR_HIGHLIGHT_2: Secondary.B20
    COLOR_HIGHLIGHT_3: Secondary.B30
    COLOR_HIGHLIGHT_4: Secondary.B50

    # Colors for occurrences from find widget
    COLOR_OCCURRENCE_1: Primary.B10
    COLOR_OCCURRENCE_2: Primary.B20
    COLOR_OCCURRENCE_3: Primary.B30
    COLOR_OCCURRENCE_4: Primary.B50
    COLOR_OCCURRENCE_5: Primary.B80

    # Editor colors
    EDITOR_BACKGROUND: Primary.B10
    EDITOR_CURRENTLINE: Primary.B30
    EDITOR_CURRENTCELL: Primary.B20
    EDITOR_OCCURRENCE: Syntax.B30
    EDITOR_CTRLCLICK: Syntax.B40
    EDITOR_SIDEAREAS: Syntax.B50
    EDITOR_MATCHED_P: Syntax.B60
    EDITOR_UNMATCHED_P: Syntax.B70
    EDITOR_NORMAL: [Syntax.B80, false, false]
    EDITOR_KEYWORD: [Syntax.B90, false, false]
    EDITOR_MAGIC: [Syntax.B100, false, false]
    EDITOR_BUILTIN: [Syntax.B110, false, false]
    EDITOR_DEFINITION: [Syntax.B120, true, false]
    EDITOR_COMMENT: [Syntax.B130, false, true]
    EDITOR_STRING: [Syntax.B140, false, false]
    EDITOR_NUMBER: [Syntax.B150, false, false]
    EDITOR_INSTANCE: [Syntax.B160, false, true]
    EDITOR_SYMBOL: [Syntax.B170, false, false]

    # Extended Python roles: deliberate shared colors are explicit.
    EDITOR_OPERATOR: [PythonDark.B10, false, false]
    EDITOR_PUNCTUATION: [PythonDark.B20, false, false]
    EDITOR_SEPARATOR: [PythonDark.B30, false, false]
    EDITOR_CLASS: [PythonDark.B40, false, false]
    EDITOR_FUNCTION_CALL: [PythonDark.B50, false, false]
    EDITOR_DOCSTRING: [PythonDark.B60, false, false]
    EDITOR_TYPE: [PythonDark.B70, false, false]
    EDITOR_BASECLASS: [PythonDark.B80, false, false]
    EDITOR_STORAGE: [PythonDark.B90, false, false]
    EDITOR_CONSTANT: [PythonDark.B100, false, false]
    EDITOR_VARIABLE: [PythonDark.B110, false, false]
    EDITOR_PARAMETER: [PythonDark.B120, false, true]
    EDITOR_CLASS_REFERENCE: [PythonDark.B130, false, false]
    EDITOR_BRACKET_1: [PythonDark.B140, false, false]
    EDITOR_BRACKET_2: [PythonDark.B150, false, false]
    EDITOR_BRACKET_3: [PythonDark.B160, false, false]
    EDITOR_WORD_OPERATOR: [PythonDark.B170, false, false]
    EDITOR_BRACKET_4: [PythonDark.B180, false, false]
    EDITOR_BRACKET_5: [PythonDark.B190, false, false]
    EDITOR_BRACKET_6: [PythonDark.B200, false, false]

    # Colors for Spyder and Python logos
    PYTHON_LOGO_UP: Logos.B10
    PYTHON_LOGO_DOWN: Logos.B20
    SPYDER_LOGO_BACKGROUND: Primary.B20
    SPYDER_LOGO_WEB: Primary.B140
    SPYDER_LOGO_SNAKE: Primary.B140

    # For special tabs
    SPECIAL_TABS_SEPARATOR: Primary.B70
    SPECIAL_TABS_SELECTED: Secondary.B50

    # For the heart used to ask for donations
    COLOR_HEART: Secondary.B80

    # For editor tooltips
    TIP_TITLE_COLOR: Success.B110
    TIP_CHAR_HIGHLIGHT_COLOR: Syntax.B170

    # Tooltip opacity (numeric value, not a color reference)
    OPACITY_TOOLTIP: 230
  light:

    # Explicit Qt chrome: preserve this Spyder adaptation, independently of editor.
    COLOR_TOOLBAR_BACKGROUND: Primary.B110
    # Slightly darker existing neutral keeps light gutter labels readable.
    COLOR_EDITOR_LINE_NUMBER: Primary.B70
    COLOR_STATUSBAR_BACKGROUND: Primary.B110
    COLOR_STATUSBAR_TEXT: Primary.B20
    COLOR_TAB_TEXT: Primary.B20
    COLOR_TAB_SELECTED_TEXT: Primary.B0
    COLOR_TAB_SELECTED_BACKGROUND: Neutral.B80
    COLOR_TAB_SELECTED_ACCENT: Neutral.B90
    COLOR_TAB_HOVER_BACKGROUND: Primary.B120
    COLOR_TREE_TEXT: Primary.B20
    COLOR_TREE_HOVER_BACKGROUND: Primary.B120
    COLOR_TREE_SELECTED_BACKGROUND: Neutral.B100
    COLOR_TREE_SELECTED_TEXT: Primary.B0
    COLOR_TREE_INACTIVE_SELECTION_BACKGROUND: Primary.B120
    COLOR_TREE_INACTIVE_SELECTION_TEXT: Primary.B0
    TAB_SELECTED_ACCENT_INNER_EDGE: 1
    TAB_SELECTED_ACCENT_WIDTH: 3
    # Background colors
    COLOR_BACKGROUND_1: Primary.B140
    COLOR_BACKGROUND_2: Primary.B130
    COLOR_BACKGROUND_3: Primary.B120
    COLOR_BACKGROUND_4: Primary.B110
    COLOR_BACKGROUND_5: Primary.B100
    COLOR_BACKGROUND_6: Primary.B90

    # Text colors
    COLOR_TEXT_1: Primary.B20
    COLOR_TEXT_2: Primary.B30
    COLOR_TEXT_3: Primary.B40
    COLOR_TEXT_4: Primary.B50

    # Accent colors
    COLOR_ACCENT_1: Neutral.B110
    COLOR_ACCENT_2: Neutral.B100
    COLOR_ACCENT_3: Neutral.B90
    COLOR_ACCENT_4: Neutral.B80
    COLOR_ACCENT_5: Neutral.B70

    # Disabled elements
    COLOR_DISABLED: Primary.B90
    COLOR_EMPTY: Neutral.B90

    # Colors for information and feedback in dialogs
    COLOR_SUCCESS_1: Success.B90
    COLOR_SUCCESS_2: Success.B80
    COLOR_SUCCESS_3: Success.B60
    COLOR_SUCCESS_4: Success.B40
    COLOR_SUCCESS_5: Success.B20
    COLOR_ERROR_1: Error.B70
    COLOR_ERROR_2: Error.B60
    COLOR_ERROR_3: Error.B40
    COLOR_ERROR_4: Error.B30
    COLOR_ERROR_5: Error.B20
    COLOR_WARN_1: Warning.B110
    COLOR_WARN_2: Warning.B80
    COLOR_WARN_3: Warning.B60
    COLOR_WARN_4: Warning.B50
    COLOR_WARN_5: Warning.B30

    # Icon colors
    ICON_1: Primary.B30
    ICON_2: Tertiary.B70
    ICON_3: Success.B70
    ICON_4: Error.B80
    ICON_5: Warning.B80
    ICON_6: Primary.B90
    ICON_7: Quaternary.B60

    # Colors for icons and variable explorer
    GROUP_1: GroupLight.B10
    GROUP_2: GroupLight.B20
    GROUP_3: GroupLight.B30
    GROUP_4: GroupLight.B40
    GROUP_5: GroupLight.B50
    GROUP_6: GroupLight.B60
    GROUP_7: GroupLight.B70
    GROUP_8: GroupLight.B80
    GROUP_9: GroupLight.B90
    GROUP_10: GroupLight.B100
    GROUP_11: GroupLight.B110
    GROUP_12: GroupLight.B120

    # Colors for highlight in editor
    COLOR_HIGHLIGHT_1: Secondary.B140
    COLOR_HIGHLIGHT_2: Secondary.B130
    COLOR_HIGHLIGHT_3: Secondary.B120
    COLOR_HIGHLIGHT_4: Secondary.B100

    # Colors for occurrences from find widget
    COLOR_OCCURRENCE_1: Primary.B140
    COLOR_OCCURRENCE_2: Primary.B130
    COLOR_OCCURRENCE_3: Primary.B120
    COLOR_OCCURRENCE_4: Primary.B100
    COLOR_OCCURRENCE_5: Primary.B70

    # Editor colors
    EDITOR_BACKGROUND: Primary.B140
    EDITOR_CURRENTLINE: Primary.B120
    EDITOR_CURRENTCELL: Primary.B130
    EDITOR_OCCURRENCE: SyntaxLight.B30
    EDITOR_CTRLCLICK: SyntaxLight.B40
    EDITOR_SIDEAREAS: Primary.B120
    EDITOR_MATCHED_P: SyntaxLight.B60
    EDITOR_UNMATCHED_P: SyntaxLight.B70
    EDITOR_NORMAL: [SyntaxLight.B80, false, false]
    EDITOR_KEYWORD: [SyntaxLight.B90, false, false]
    EDITOR_MAGIC: [SyntaxLight.B100, false, false]
    EDITOR_BUILTIN: [SyntaxLight.B110, false, false]
    EDITOR_DEFINITION: [SyntaxLight.B120, true, false]
    EDITOR_COMMENT: [SyntaxLight.B130, false, true]
    EDITOR_STRING: [SyntaxLight.B140, false, false]
    EDITOR_NUMBER: [SyntaxLight.B150, false, false]
    EDITOR_INSTANCE: [SyntaxLight.B160, false, true]
    EDITOR_SYMBOL: [SyntaxLight.B170, false, false]

    # Extended Python roles: deliberate shared colors are explicit.
    EDITOR_OPERATOR: [PythonLight.B10, false, false]
    EDITOR_PUNCTUATION: [PythonLight.B20, false, false]
    EDITOR_SEPARATOR: [PythonLight.B30, false, false]
    EDITOR_CLASS: [PythonLight.B40, false, false]
    EDITOR_FUNCTION_CALL: [PythonLight.B50, false, false]
    EDITOR_DOCSTRING: [PythonLight.B60, false, false]
    EDITOR_TYPE: [PythonLight.B70, false, false]
    EDITOR_BASECLASS: [PythonLight.B80, false, false]
    EDITOR_STORAGE: [PythonLight.B90, false, false]
    EDITOR_CONSTANT: [PythonLight.B100, false, false]
    EDITOR_VARIABLE: [PythonLight.B110, false, false]
    EDITOR_PARAMETER: [PythonLight.B120, false, true]
    EDITOR_CLASS_REFERENCE: [PythonLight.B130, false, false]
    EDITOR_BRACKET_1: [PythonLight.B140, false, false]
    EDITOR_BRACKET_2: [PythonLight.B150, false, false]
    EDITOR_BRACKET_3: [PythonLight.B160, false, false]
    EDITOR_WORD_OPERATOR: [PythonLight.B170, false, false]
    EDITOR_BRACKET_4: [PythonLight.B180, false, false]
    EDITOR_BRACKET_5: [PythonLight.B190, false, false]
    EDITOR_BRACKET_6: [PythonLight.B200, false, false]

    # Colors for Spyder and Python logos
    PYTHON_LOGO_UP: Logos.B10
    PYTHON_LOGO_DOWN: Logos.B20
    SPYDER_LOGO_BACKGROUND: Logos.B40
    SPYDER_LOGO_WEB: Logos.B50
    SPYDER_LOGO_SNAKE: Logos.B30

    # For special tabs
    SPECIAL_TABS_SEPARATOR: Primary.B90
    SPECIAL_TABS_SELECTED: Neutral.B80

    # For the heart used to ask for donations
    COLOR_HEART: Error.B70

    # For editor tooltips
    TIP_TITLE_COLOR: Success.B70
    TIP_CHAR_HIGHLIGHT_COLOR: SyntaxLight.B170

    # Tooltip opacity (numeric value, not a color reference)
    OPACITY_TOOLTIP: 230

css_overrides:
  --syn-operator:
    dark: PythonDark.B10
    light: PythonLight.B10
  --note-bg:
    dark: COLOR_HIGHLIGHT_2
    light: COLOR_HIGHLIGHT_3
  --border-light:
    dark: COLOR_HIGHLIGHT_3
    light: COLOR_HIGHLIGHT_4
  --link-color:
    dark: COLOR_SUCCESS_3
    light: COLOR_ERROR_3

appeal_overrides:
  --link-color:
    dark: COLOR_SUCCESS_3
    light: COLOR_ERROR_3
  --hover-color:
    dark: COLOR_SUCCESS_3
    light: COLOR_ERROR_3

pydoc_overrides:
  --link-color:
    dark: COLOR_SUCCESS_3
    light: COLOR_ERROR_3
  --hover-color:
    dark: COLOR_SUCCESS_3
    light: COLOR_ERROR_3
