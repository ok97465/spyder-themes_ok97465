css_overrides:
  --note-bg: 
    dark: COLOR_HIGHLIGHT_3
    light: COLOR_HIGHLIGHT_2
  --border-light: COLOR_HIGHLIGHT_4
  --border-color:
    dark: Primary.B50
    light: Primary.B40
