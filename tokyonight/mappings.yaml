---
# Adapted from the canonical Night and Day palettes at:
# https://github.com/folke/tokyonight.nvim/blob/cdc07ac78467a233fd62c493de29a17e0cf2b2b6/extras/lua/tokyonight_night.lua
# https://github.com/folke/tokyonight.nvim/blob/cdc07ac78467a233fd62c493de29a17e0cf2b2b6/extras/lua/tokyonight_day.lua
# Spyder groups several upstream syntax categories into one role.
# Keywords use Treesitter @keyword; numbers use Constant; self uses @variable.builtin.
# https://github.com/folke/tokyonight.nvim/blob/cdc07ac78467a233fd62c493de29a17e0cf2b2b6/lua/tokyonight/groups/treesitter.lua
# https://github.com/folke/tokyonight.nvim/blob/cdc07ac78467a233fd62c493de29a17e0cf2b2b6/lua/tokyonight/groups/base.lua
color_classes:
  NativeUiDark: TokyoNightNativeUiDark
  PythonDark: TokyoNightPythonDark
  NativeUiLight: TokyoNightNativeUiLight
  PythonLight: TokyoNightPythonLight
  WidgetFillDark: TokyoNightWidgetFillDark
  WidgetFillLight: TokyoNightWidgetFillLight
  Primary: TokyoNightSurfaceDark
  Secondary: TokyoNightBlue
  Tertiary: TokyoNightCyan
  Quaternary: TokyoNightPurple
  Success: TokyoNightGreen
  Error: TokyoNightRed
  Warning: TokyoNightYellow
  GroupDark: TokyoNightGroupsDark
  GroupLight: TokyoNightGroupsLight
  Syntax: TokyoNightSyntaxDark
  SyntaxLight: TokyoNightSyntaxLight
  Logos: Logos
  SurfaceDark: TokyoNightSurfaceDark
  SurfaceLight: TokyoNightSurfaceLight
  AccentDark: TokyoNightAccentsDark
  AccentLight: TokyoNightAccentsLight
semantic_mappings:
  dark:
    COLOR_BACKGROUND_1: SurfaceDark.B10
    COLOR_BACKGROUND_2: SurfaceDark.B20
    COLOR_BACKGROUND_3: SurfaceDark.B30
    COLOR_BACKGROUND_4: NativeUiDark.B80
    COLOR_BACKGROUND_5: SurfaceDark.B60
    COLOR_BACKGROUND_6: SurfaceDark.B70
    COLOR_TEXT_1: SurfaceDark.B110
    COLOR_TEXT_2: SurfaceDark.B100
    COLOR_TEXT_3: SurfaceDark.B160
    COLOR_TEXT_4: SurfaceDark.B90
    # Qt keeps COLOR_TEXT_1 over selected/hovered fills. Use upstream
    # visual/blue7/blue0 for backgrounds; bright blue/cyan remain link accents.
    COLOR_ACCENT_1: SurfaceDark.B40
    COLOR_ACCENT_2: WidgetFillDark.B10
    COLOR_ACCENT_3: WidgetFillDark.B20
    COLOR_ACCENT_4: AccentDark.B30
    COLOR_ACCENT_5: AccentDark.B40
    COLOR_DISABLED: SurfaceDark.B70
    COLOR_EMPTY: SurfaceDark.B50
    COLOR_SUCCESS_1: AccentDark.B50
    COLOR_SUCCESS_2: Success.B40
    COLOR_SUCCESS_3: Success.B70
    COLOR_SUCCESS_4: Success.B100
    COLOR_SUCCESS_5: Success.B120
    COLOR_ERROR_1: AccentDark.B80
    COLOR_ERROR_2: AccentDark.B80
    COLOR_ERROR_3: Error.B70
    COLOR_ERROR_4: Error.B100
    COLOR_ERROR_5: Error.B120
    COLOR_WARN_1: AccentDark.B100
    COLOR_WARN_2: AccentDark.B100
    COLOR_WARN_3: Warning.B70
    COLOR_WARN_4: Warning.B100
    COLOR_WARN_5: Warning.B120
    ICON_1: SurfaceDark.B110
    ICON_2: AccentDark.B20
    ICON_3: AccentDark.B50
    ICON_4: AccentDark.B70
    ICON_5: AccentDark.B100
    ICON_6: SurfaceDark.B50
    ICON_7: AccentDark.B120
    GROUP_1: GroupDark.B10
