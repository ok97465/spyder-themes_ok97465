    COLOR_TREE_HOVER_BACKGROUND: NativeUiDark.B100
    COLOR_TREE_SELECTED_BACKGROUND: NativeUiDark.B110
    COLOR_TREE_INACTIVE_SELECTION_BACKGROUND: NativeUiDark.B120
    COLOR_TREE_SELECTED_TEXT: NativeUiDark.B130
    COLOR_TREE_TEXT: NativeUiDark.B140
    COLOR_TREE_INACTIVE_SELECTION_TEXT: NativeUiDark.B150
