    EDITOR_BUILTIN: [Syntax.B110, false, false]
    EDITOR_DEFINITION: [Syntax.B120, false, false]
    EDITOR_COMMENT: [Syntax.B130, false, true]
    EDITOR_STRING: [Syntax.B140, false, false]
    EDITOR_NUMBER: [Syntax.B150, false, false]
    EDITOR_INSTANCE: [Syntax.B160, false, false]
    EDITOR_SYMBOL: [Syntax.B170, false, false]
    PYTHON_LOGO_UP: Logos.B10
    PYTHON_LOGO_DOWN: Logos.B20
    SPYDER_LOGO_BACKGROUND: SurfaceDark.B20
    SPYDER_LOGO_WEB: SurfaceDark.B110
    SPYDER_LOGO_SNAKE: SurfaceDark.B110
    SPECIAL_TABS_SEPARATOR: SurfaceDark.B50
    SPECIAL_TABS_SELECTED: NativeUiDark.B70
    COLOR_HEART: AccentDark.B70
    TIP_TITLE_COLOR: AccentDark.B10
    TIP_CHAR_HIGHLIGHT_COLOR: Syntax.B170
    OPACITY_TOOLTIP: 230
    # Source distinctions; identical bracket slots intentionally disable rainbow coloring.
    EDITOR_OPERATOR: [PythonDark.B10, false, false]
    EDITOR_WORD_OPERATOR: [PythonDark.B10, false, false]
    EDITOR_PUNCTUATION: [PythonDark.B20, false, false]
    EDITOR_SEPARATOR: [PythonDark.B30, false, false]
    EDITOR_CLASS: [PythonDark.B40, false, false]
    EDITOR_FUNCTION_CALL: [PythonDark.B50, false, false]
    EDITOR_DOCSTRING: [PythonDark.B60, false, false]
    EDITOR_TYPE: [PythonDark.B70, false, false]
    EDITOR_BASECLASS: [PythonDark.B80, false, false]
    EDITOR_STORAGE: [PythonDark.B90, false, false]
    EDITOR_CONSTANT: [PythonDark.B100, false, false]
    EDITOR_VARIABLE: [PythonDark.B110, false, false]
    EDITOR_PARAMETER: [PythonDark.B120, false, false]
    EDITOR_CLASS_REFERENCE: [PythonDark.B130, false, false]
    EDITOR_BRACKET_1: [PythonDark.B140, false, false]
    EDITOR_BRACKET_2: [PythonDark.B150, false, false]
    EDITOR_BRACKET_3: [PythonDark.B160, false, false]
    # Repeat the native three-color cycle (or unchanged punctuation) at depths 4-6.
    EDITOR_BRACKET_4: [PythonDark.B140, false, false]
    EDITOR_BRACKET_5: [PythonDark.B150, false, false]
    EDITOR_BRACKET_6: [PythonDark.B160, false, false]
    # Native widget colors, with translucent fills flattened over their source surface.
    COLOR_STATUSBAR_BACKGROUND: NativeUiDark.B10
    COLOR_STATUSBAR_TEXT: NativeUiDark.B20
    COLOR_TOOLBAR_BACKGROUND: NativeUiDark.B30
    COLOR_EDITOR_LINE_NUMBER: NativeUiDark.B40
