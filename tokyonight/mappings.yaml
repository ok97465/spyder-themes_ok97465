css_overrides:
  --syn-operator:
    dark: EDITOR_OPERATOR
    light: EDITOR_OPERATOR
  # Warning roles are also foregrounds in Spyder; give help admonitions
  # separate low-contrast background shades while preserving readable text.
  --warning-bg:
    dark: Warning.B20
    light: Warning.B130
  --syn-error-bg:
    dark: Error.B20
    light: Error.B140
  --header-bg-color:
    dark: SurfaceDark.B40
    light: SurfaceLight.B20
  --header-text-color:
    dark: SurfaceDark.B110
    light: SurfaceLight.B110
  --note-bg:
    dark: SurfaceDark.B30
    light: SurfaceLight.B30
  --border-light:
    dark: SurfaceDark.B50
    light: SurfaceLight.B50
  --link-color:
    dark: AccentDark.B10
    light: AccentLight.B10
  --hover-color:
    dark: AccentDark.B30
    light: AccentLight.B30

appeal_overrides:
