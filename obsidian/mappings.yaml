    EDITOR_NUMBER: [SyntaxLight.B150, false, false]
    EDITOR_INSTANCE: [SyntaxLight.B160, false, true]
    EDITOR_SYMBOL: [SyntaxLight.B170, false, false]

    # Optional Python roles: source distinctions within this custom adaptation.
    EDITOR_OPERATOR: [SyntaxLight.B170, false, false]
    EDITOR_WORD_OPERATOR: [SyntaxLight.B90, true, false]
    EDITOR_PUNCTUATION: [SyntaxLight.B80, false, false]
    EDITOR_SEPARATOR: [SyntaxLight.B80, false, false]
    EDITOR_CLASS: [SyntaxLight.B120, false, false]
    EDITOR_FUNCTION_CALL: [SyntaxLight.B80, false, false]
    EDITOR_DOCSTRING: [SyntaxLight.B130, false, false]
