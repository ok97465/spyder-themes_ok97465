    # Colors for information and feedback in dialogs
    COLOR_SUCCESS_1: Success.B70
    COLOR_SUCCESS_2: Success.B60
    COLOR_SUCCESS_3: Success.B50
    COLOR_SUCCESS_4: Success.B40
    COLOR_SUCCESS_5: Success.B30
    COLOR_ERROR_1: Error.B60
