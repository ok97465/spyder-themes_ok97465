# https://github.com/microsoft/vscode/blob/1306698e328e5e531f5e632301d30020aa994eff/extensions/theme-defaults/themes/light_modern.json
# UI-only intermediate shades and opaque alpha composites are adapted for Qt.
# dark_modern.json SHA-256: 58d4ea55a2a36f65c0d5caf033dfddc4ec7d4b3a5d8b731a84bc36001d26a339
# light_modern.json SHA-256: 831b47d624e9acd6f09da58a699889415be7e45fccffb01177bc718b20e7e25c
# Syntax B10..B170 follow the editor slot order documented in catppuccin-mocha.
# The include chain is Modern -> *_plus -> *_vs, at the revision above.
# Modern overrides UI colors only; Plus/VS supply the effective Python rules.
# Control keywords use keyword.control; def/class use storage.type; symbol
# operators use keyword.operator; and/or/not use keyword.operator.logical.python.
# Contextual calls/classes/variables/parameters use VS Code semantic fallback
# scopes: entity.name.function, entity.name.type.class, variable.other.readwrite,
# variable.parameter. This port does not provide external LSP type inference.
# Native body self/cls use variable.language. Spyder's shared instance role
# also colors declaration self/cls this way, unlike native parameter scope.
# Punctuation uses Modern editor.foreground; symbol operators retain VS colors.
# Native bracket colors cycle every three levels (depths 4-6 repeat).
# Defaults not present in the JSON come from the pinned editorColorRegistry.ts,
# colors/editorColors.ts, colors/listColors.ts and highlightDecorations.ts.
# Sidebar/tab/status/gutter colors are native; tree selections use inherited
# VS Code defaults except Light Modern's explicit gray active selection.
# Current-line border colors become opaque Spyder line fills. Cell backgrounds
# use sidebar shades; unmatched brackets use a muted native error fill.
# Syntax B30/B200 flatten wordHighlightBackground; B190 flattens inherited
# selectionHighlightBackground over editor.background; B220 is native selection.
# B210 interpolates native selection for a Qt-only intermediate highlight.
# Bracket-match alpha is flattened over editor.background for Qt.
# Primary/accent/feedback ramps, help fills and Variable Explorer groups are
# Qt adaptations. Dark groups blend native hues 60% over sideBar.background.
