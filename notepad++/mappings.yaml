---
# Personal Spyder palette; dark is custom, not Notepad++ DarkModeDefault.
# Python role reference: Notepad++ v8.8.6 PowerEditor/src/stylers.model.xml
# https://github.com/notepad-plus-plus/notepad-plus-plus/blob/v8.8.6/PowerEditor/src/stylers.model.xml
# SHA256 d3ef9a4f5c3e0f7e5103614afb42b00908816fdeaf59b0a0b9cb7d356985eea9
# Light: class names are bold normal text, operators/punctuation use navy, and
# documentation uses the existing readable orange/brown rather than gray strings.
# Existing custom backgrounds, readable syntax shades and shared styles remain.
color_classes:
  Primary: ChromaticBlueWhale
  Secondary: PromptTadornaTeal
  Tertiary: BruteForceCanadianTuxedo
  Quaternary: SomePurpleRain
  Success: MeanPhosphorGreen
  Error: SluggishRedPegasus
  Warning: MeekOrangeJuice
  GroupDark: SpryMagentaDark
  GroupLight: SpryMagentaLight
  Syntax: PokyIsolationSyntaxDark
  SyntaxLight: PokyIsolationSyntaxLight
  Logos: Logos
semantic_mappings:
  dark:
    # Background colors
    COLOR_BACKGROUND_1: Primary.B10
    COLOR_BACKGROUND_2: Primary.B20
    COLOR_BACKGROUND_3: Primary.B30
    COLOR_BACKGROUND_4: Primary.B40
    COLOR_BACKGROUND_5: Primary.B50
    COLOR_BACKGROUND_6: Primary.B70

    # Text colors
    COLOR_TEXT_1: Primary.B130
    COLOR_TEXT_2: Primary.B120
    COLOR_TEXT_3: Primary.B110
    COLOR_TEXT_4: Primary.B100

    # Accent colors
    COLOR_ACCENT_1: Secondary.B40
    COLOR_ACCENT_2: Secondary.B50
    COLOR_ACCENT_3: Secondary.B60
    COLOR_ACCENT_4: Secondary.B70
    COLOR_ACCENT_5: Secondary.B80

    # Disabled elements
    COLOR_DISABLED: Primary.B70
    COLOR_EMPTY: Secondary.B70

    # Colors for information and feedback in dialogs
    COLOR_SUCCESS_1: Success.B120
    COLOR_SUCCESS_2: Success.B70
    COLOR_SUCCESS_3: Success.B90
    COLOR_SUCCESS_4: Success.B110
    COLOR_SUCCESS_5: Success.B130
    COLOR_ERROR_1: Error.B60
    COLOR_ERROR_2: Error.B70
    COLOR_ERROR_3: Error.B110
    COLOR_ERROR_4: Error.B120
    COLOR_ERROR_5: Error.B130
    COLOR_WARN_1: Warning.B40
    COLOR_WARN_2: Warning.B90
    COLOR_WARN_3: Warning.B100
    COLOR_WARN_4: Warning.B110
    COLOR_WARN_5: Warning.B120

    # Icon colors
    ICON_1: Primary.B140
    ICON_2: Tertiary.B90
    ICON_3: Success.B110
    ICON_4: Error.B70
    ICON_5: Warning.B100
    ICON_6: Primary.B30
    ICON_7: Quaternary.B100

    # Colors for variable explorer, and mixed uses of the color system
    GROUP_1: GroupDark.B10
    GROUP_2: GroupDark.B20
    GROUP_3: GroupDark.B30
    GROUP_4: GroupDark.B40
    GROUP_5: GroupDark.B50
    GROUP_6: GroupDark.B60
    GROUP_7: GroupDark.B70
    GROUP_8: GroupDark.B80
    GROUP_9: GroupDark.B90
    GROUP_10: GroupDark.B100
    GROUP_11: GroupDark.B110
    GROUP_12: GroupDark.B120

    # Colors for highlight in editor
    COLOR_HIGHLIGHT_1: Secondary.B10
    COLOR_HIGHLIGHT_2: Secondary.B20
    COLOR_HIGHLIGHT_3: Secondary.B30
    COLOR_HIGHLIGHT_4: Secondary.B50

    # Colors for occurrences from find widget
    COLOR_OCCURRENCE_1: Primary.B10
    COLOR_OCCURRENCE_2: Primary.B20
    COLOR_OCCURRENCE_3: Primary.B30
    COLOR_OCCURRENCE_4: Primary.B50
    COLOR_OCCURRENCE_5: Primary.B80

    # Editor colors
    EDITOR_BACKGROUND: Primary.B10
    EDITOR_CURRENTLINE: Syntax.B10
    EDITOR_CURRENTCELL: Syntax.B20
    EDITOR_OCCURRENCE: Syntax.B30
    EDITOR_CTRLCLICK: Syntax.B40
    EDITOR_SIDEAREAS: Syntax.B50
    EDITOR_MATCHED_P: Syntax.B60
    EDITOR_UNMATCHED_P: Syntax.B70
    EDITOR_NORMAL: [Syntax.B80, false, false]
    EDITOR_KEYWORD: [Syntax.B90, false, false]
    EDITOR_MAGIC: [Syntax.B100, false, false]
    EDITOR_BUILTIN: [Syntax.B110, false, false]
    EDITOR_DEFINITION: [Syntax.B120, false, false]
    EDITOR_COMMENT: [Syntax.B130, false, false]
    EDITOR_STRING: [Syntax.B140, false, true]
    EDITOR_NUMBER: [Syntax.B150, false, false]
    EDITOR_INSTANCE: [Syntax.B160, false, true]
    EDITOR_SYMBOL: [Syntax.B170, false, false]

    # Optional Python roles: source distinctions within this custom adaptation.
    EDITOR_OPERATOR: [Syntax.B170, false, false]
    EDITOR_WORD_OPERATOR: [Syntax.B90, false, false]
    EDITOR_PUNCTUATION: [Syntax.B80, false, false]
    EDITOR_SEPARATOR: [Syntax.B80, false, false]
    EDITOR_CLASS: [Syntax.B120, false, false]
    EDITOR_FUNCTION_CALL: [Syntax.B80, false, false]
    EDITOR_DOCSTRING: [Syntax.B140, false, true]
    EDITOR_TYPE: [Syntax.B110, false, false]
    EDITOR_BASECLASS: [Syntax.B80, false, false]
    EDITOR_STORAGE: [Syntax.B90, false, false]
    EDITOR_CONSTANT: [Syntax.B90, false, false]
    EDITOR_VARIABLE: [Syntax.B80, false, false]
    EDITOR_PARAMETER: [Syntax.B80, false, false]
    EDITOR_CLASS_REFERENCE: [Syntax.B80, false, false]
    EDITOR_BRACKET_1: [Syntax.B80, false, false]
    EDITOR_BRACKET_2: [Syntax.B80, false, false]
    EDITOR_BRACKET_3: [Syntax.B80, false, false]
    EDITOR_BRACKET_4: [Syntax.B80, false, false]
    EDITOR_BRACKET_5: [Syntax.B80, false, false]
    EDITOR_BRACKET_6: [Syntax.B80, false, false]

    # Colors for Spyder and Python logos
    PYTHON_LOGO_UP: Logos.B10
    PYTHON_LOGO_DOWN: Logos.B20
    SPYDER_LOGO_BACKGROUND: Primary.B20
    SPYDER_LOGO_WEB: Primary.B140
    SPYDER_LOGO_SNAKE: Primary.B130

    # For special tabs
    SPECIAL_TABS_SEPARATOR: Primary.B60
    SPECIAL_TABS_SELECTED: Secondary.B60

    # Explicit Qt adaptation: preserve existing chrome, separate selected text.
    COLOR_TOOLBAR_BACKGROUND: Primary.B40
    COLOR_EDITOR_LINE_NUMBER: Primary.B100
    COLOR_STATUSBAR_BACKGROUND: Primary.B40
    COLOR_STATUSBAR_TEXT: Primary.B130
    COLOR_TAB_TEXT: Primary.B130
    COLOR_TAB_SELECTED_TEXT: Primary.B150
    COLOR_TAB_SELECTED_BACKGROUND: Secondary.B60
    COLOR_TAB_SELECTED_ACCENT: Secondary.B70
    COLOR_TAB_HOVER_BACKGROUND: Primary.B50
    COLOR_TREE_TEXT: Primary.B130
    COLOR_TREE_HOVER_BACKGROUND: Primary.B30
    COLOR_TREE_SELECTED_BACKGROUND: Secondary.B50
    COLOR_TREE_SELECTED_TEXT: Primary.B130
    COLOR_TREE_INACTIVE_SELECTION_BACKGROUND: Primary.B30
    COLOR_TREE_INACTIVE_SELECTION_TEXT: Primary.B130
    TAB_SELECTED_ACCENT_INNER_EDGE: 1
    TAB_SELECTED_ACCENT_WIDTH: 3

    # For the heart used to ask for donations
    COLOR_HEART: Error.B70

    # For editor tooltips
    TIP_TITLE_COLOR: Success.B80
    TIP_CHAR_HIGHLIGHT_COLOR: Syntax.B170

    # Tooltip opacity (numeric value, not a color reference)
    OPACITY_TOOLTIP: 230
  light:
    # Background colors
    COLOR_BACKGROUND_1: Primary.B140
    COLOR_BACKGROUND_2: Primary.B130
    COLOR_BACKGROUND_3: Primary.B120
    COLOR_BACKGROUND_4: Primary.B110
    COLOR_BACKGROUND_5: Primary.B100
    COLOR_BACKGROUND_6: Primary.B90

    # Text colors
    COLOR_TEXT_1: Primary.B20
    COLOR_TEXT_2: Primary.B30
    COLOR_TEXT_3: Primary.B40
    COLOR_TEXT_4: Primary.B50

    # Accent colors
    COLOR_ACCENT_1: Secondary.B100
    COLOR_ACCENT_2: Secondary.B90
    COLOR_ACCENT_3: Secondary.B70
    COLOR_ACCENT_4: Secondary.B60
    COLOR_ACCENT_5: Secondary.B50

    # Disabled elements
    COLOR_DISABLED: Primary.B80
    COLOR_EMPTY: Secondary.B70

    # Colors for information and feedback in dialogs
    COLOR_SUCCESS_1: Success.B90
    COLOR_SUCCESS_2: Success.B80
    COLOR_SUCCESS_3: Success.B60
    COLOR_SUCCESS_4: Success.B40
    COLOR_SUCCESS_5: Success.B20
    COLOR_ERROR_1: Error.B60
    COLOR_ERROR_2: Error.B50
    COLOR_ERROR_3: Error.B40
    COLOR_ERROR_4: Error.B30
    COLOR_ERROR_5: Error.B110
    COLOR_WARN_1: Warning.B110
    COLOR_WARN_2: Warning.B80
    COLOR_WARN_3: Warning.B60
    COLOR_WARN_4: Warning.B50
    COLOR_WARN_5: Warning.B30

    # Icon colors
    ICON_1: Primary.B20
    ICON_2: Tertiary.B70
    ICON_3: Success.B70
    ICON_4: Error.B80
    ICON_5: Warning.B80
    ICON_6: Primary.B130
    ICON_7: Quaternary.B80

    # Colors for icons and variable explorer
    GROUP_1: GroupLight.B10
    GROUP_2: GroupLight.B20
    GROUP_3: GroupLight.B30
    GROUP_4: GroupLight.B40
    GROUP_5: GroupLight.B50
    GROUP_6: GroupLight.B60
    GROUP_7: GroupLight.B70
    GROUP_8: GroupLight.B80
    GROUP_9: GroupLight.B90
    GROUP_10: GroupLight.B100
    GROUP_11: GroupLight.B110
    GROUP_12: GroupLight.B120

    # Colors for highlight in editor
    COLOR_HIGHLIGHT_1: Secondary.B140
    COLOR_HIGHLIGHT_2: Secondary.B130
    COLOR_HIGHLIGHT_3: Secondary.B120
    COLOR_HIGHLIGHT_4: Secondary.B100

    # Colors for occurrences from find widget
    COLOR_OCCURRENCE_1: Primary.B140
    COLOR_OCCURRENCE_2: Primary.B130
    COLOR_OCCURRENCE_3: Primary.B120
    COLOR_OCCURRENCE_4: Primary.B100
    COLOR_OCCURRENCE_5: Primary.B70

    # Editor colors
    EDITOR_BACKGROUND: Primary.B140
    EDITOR_CURRENTLINE: SyntaxLight.B10
    EDITOR_CURRENTCELL: SyntaxLight.B20
    EDITOR_OCCURRENCE: SyntaxLight.B30
    EDITOR_CTRLCLICK: SyntaxLight.B40
    EDITOR_SIDEAREAS: SyntaxLight.B50
    EDITOR_MATCHED_P: SyntaxLight.B60
    EDITOR_UNMATCHED_P: SyntaxLight.B70
    EDITOR_NORMAL: [SyntaxLight.B80, false, false]
    EDITOR_KEYWORD: [SyntaxLight.B90, false, false]
    EDITOR_MAGIC: [SyntaxLight.B100, false, false]
    EDITOR_BUILTIN: [SyntaxLight.B110, false, false]
    EDITOR_DEFINITION: [SyntaxLight.B120, false, false]
    EDITOR_COMMENT: [SyntaxLight.B130, false, false]
    EDITOR_STRING: [SyntaxLight.B140, false, true]
    EDITOR_NUMBER: [SyntaxLight.B150, false, false]
    EDITOR_INSTANCE: [SyntaxLight.B160, false, true]
    EDITOR_SYMBOL: [SyntaxLight.B170, false, false]

    # Optional Python roles: source distinctions within this custom adaptation.
    EDITOR_OPERATOR: [SyntaxLight.B110, true, false]
    EDITOR_WORD_OPERATOR: [SyntaxLight.B90, false, false]
    EDITOR_PUNCTUATION: [SyntaxLight.B110, true, false]
    EDITOR_SEPARATOR: [SyntaxLight.B110, true, false]
    EDITOR_CLASS: [SyntaxLight.B80, true, false]
    EDITOR_FUNCTION_CALL: [SyntaxLight.B80, false, false]
    EDITOR_DOCSTRING: [SyntaxLight.B150, false, false]
    EDITOR_TYPE: [SyntaxLight.B110, false, false]
    EDITOR_BASECLASS: [SyntaxLight.B80, false, false]
    EDITOR_STORAGE: [SyntaxLight.B90, false, false]
    EDITOR_CONSTANT: [SyntaxLight.B90, false, false]
    EDITOR_VARIABLE: [SyntaxLight.B80, false, false]
    EDITOR_PARAMETER: [SyntaxLight.B80, false, false]
    EDITOR_CLASS_REFERENCE: [SyntaxLight.B80, false, false]
    EDITOR_BRACKET_1: [SyntaxLight.B110, true, false]
    EDITOR_BRACKET_2: [SyntaxLight.B110, true, false]
    EDITOR_BRACKET_3: [SyntaxLight.B110, true, false]
    EDITOR_BRACKET_4: [SyntaxLight.B110, true, false]
    EDITOR_BRACKET_5: [SyntaxLight.B110, true, false]
    EDITOR_BRACKET_6: [SyntaxLight.B110, true, false]

    # Colors for Spyder and Python logos
    PYTHON_LOGO_UP: Logos.B10
    PYTHON_LOGO_DOWN: Logos.B20
    SPYDER_LOGO_BACKGROUND: Logos.B40
    SPYDER_LOGO_WEB: Logos.B50
    SPYDER_LOGO_SNAKE: Logos.B30

    # For special tabs
    SPECIAL_TABS_SEPARATOR: Primary.B60
    SPECIAL_TABS_SELECTED: Secondary.B60

    # Explicit Qt adaptation: preserve existing chrome, separate selected text.
    COLOR_TOOLBAR_BACKGROUND: Primary.B110
    COLOR_EDITOR_LINE_NUMBER: Primary.B50
    COLOR_STATUSBAR_BACKGROUND: Primary.B110
    COLOR_STATUSBAR_TEXT: Primary.B20
    COLOR_TAB_TEXT: Primary.B20
    COLOR_TAB_SELECTED_TEXT: Primary.B150
    COLOR_TAB_SELECTED_BACKGROUND: Secondary.B60
    COLOR_TAB_SELECTED_ACCENT: Secondary.B60
    COLOR_TAB_HOVER_BACKGROUND: Primary.B100
    COLOR_TREE_TEXT: Primary.B20
    COLOR_TREE_HOVER_BACKGROUND: Primary.B120
    COLOR_TREE_SELECTED_BACKGROUND: Secondary.B90
    COLOR_TREE_SELECTED_TEXT: Primary.B20
    COLOR_TREE_INACTIVE_SELECTION_BACKGROUND: Primary.B120
    COLOR_TREE_INACTIVE_SELECTION_TEXT: Primary.B20
    TAB_SELECTED_ACCENT_INNER_EDGE: 1
    TAB_SELECTED_ACCENT_WIDTH: 3

    # For the heart used to ask for donations
    COLOR_HEART: Error.B50

    # For editor tooltips
    TIP_TITLE_COLOR: Success.B70
    TIP_CHAR_HIGHLIGHT_COLOR: SyntaxLight.B170

    # Tooltip opacity (numeric value, not a color reference)
