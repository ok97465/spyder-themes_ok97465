---
# Preserve Spyder's established custom syntax and QDarkStyle-based chrome.
# UI reference: https://github.com/ColinDuquesnoy/QDarkStyleSheet
# checked at 6f3962e63749893f951be73ebfec93e83fffebf2; this is a Spyder adaptation,
# not a replacement with current upstream defaults. File/dock tabs share the
# existing selected dock fill; light selected text stays dark for readability.
color_classes:
  OptionalUi: SpyderOptionalUi
  Primary: Gray
  Secondary: Blue
  Tertiary: Lavender
  Success: Green
  Error: Red
  Warning: Orange
  GroupDark: GroupDark
  GroupLight: GroupLight
  Syntax: GraySyntaxDark
  SyntaxLight: GraySyntaxLight
  Logos: Logos
semantic_mappings:
  dark:
    # Background colors
    COLOR_BACKGROUND_1: Primary.B10
    COLOR_BACKGROUND_2: Primary.B20
    COLOR_BACKGROUND_3: Primary.B30
    COLOR_BACKGROUND_4: Primary.B40
    COLOR_BACKGROUND_5: Primary.B50
    COLOR_BACKGROUND_6: Primary.B60

    # Text colors
    COLOR_TEXT_1: Primary.B130
    COLOR_TEXT_2: Primary.B110
    COLOR_TEXT_3: Primary.B90
    COLOR_TEXT_4: Primary.B80

    # Accent colors
    COLOR_ACCENT_1: Secondary.B20
    COLOR_ACCENT_2: Secondary.B30
    COLOR_ACCENT_3: Secondary.B50
    COLOR_ACCENT_4: Secondary.B70
    COLOR_ACCENT_5: Secondary.B80

    # Disabled elements
    COLOR_DISABLED: Primary.B70
    COLOR_EMPTY: Secondary.B50

    # Explicit Spyder chrome roles preserve the local palette (inner 3px accent).
    COLOR_TOOLBAR_BACKGROUND: Primary.B40
    COLOR_EDITOR_LINE_NUMBER: OptionalUi.B10
    COLOR_STATUSBAR_BACKGROUND: Primary.B40
    COLOR_STATUSBAR_TEXT: Primary.B130
    COLOR_TAB_TEXT: Primary.B140  # Remain readable against tab hover surfaces.
    COLOR_TAB_SELECTED_TEXT: Primary.B130
    COLOR_TAB_SELECTED_BACKGROUND: Secondary.B40
    COLOR_TAB_SELECTED_ACCENT: Secondary.B70
    COLOR_TAB_HOVER_BACKGROUND: Primary.B50
    COLOR_TREE_TEXT: Primary.B130
    COLOR_TREE_HOVER_BACKGROUND: Primary.B30
    COLOR_TREE_SELECTED_BACKGROUND: Secondary.B30
    COLOR_TREE_SELECTED_TEXT: Primary.B130
    COLOR_TREE_INACTIVE_SELECTION_BACKGROUND: Primary.B30
    COLOR_TREE_INACTIVE_SELECTION_TEXT: Primary.B130
    TAB_SELECTED_ACCENT_INNER_EDGE: 1
    TAB_SELECTED_ACCENT_WIDTH: 3

    # Colors for information and feedback in dialogs
    COLOR_SUCCESS_1: Success.B60
    COLOR_SUCCESS_2: Success.B70
    COLOR_SUCCESS_3: Success.B90
    COLOR_SUCCESS_4: Success.B110
    COLOR_SUCCESS_5: Success.B130
    COLOR_ERROR_1: Error.B40
    COLOR_ERROR_2: Error.B70
    COLOR_ERROR_3: Error.B110
    COLOR_ERROR_4: Error.B120
    COLOR_ERROR_5: Error.B130
    COLOR_WARN_1: Warning.B40
    COLOR_WARN_2: Warning.B70
    COLOR_WARN_3: Warning.B90
    COLOR_WARN_4: Warning.B100
    COLOR_WARN_5: Warning.B120

    # Icon colors
    ICON_1: Primary.B140
    ICON_2: Secondary.B80
    ICON_3: Success.B80
    ICON_4: Error.B70
    ICON_5: Warning.B70
    ICON_6: Primary.B30
    ICON_7: Tertiary.B100

    # Colors for variable explorer, and mixed uses of the color system
    GROUP_1: GroupDark.B10
    GROUP_2: GroupDark.B20
    GROUP_3: GroupDark.B30
    GROUP_4: GroupDark.B40
    GROUP_5: GroupDark.B50
    GROUP_6: GroupDark.B60
    GROUP_7: GroupDark.B70
    GROUP_8: GroupDark.B80
    GROUP_9: GroupDark.B90
    GROUP_10: GroupDark.B100
    GROUP_11: GroupDark.B110
    GROUP_12: GroupDark.B120

    # Colors for highlight in editor
    COLOR_HIGHLIGHT_1: Secondary.B10
    COLOR_HIGHLIGHT_2: Secondary.B20
    COLOR_HIGHLIGHT_3: Secondary.B30
    COLOR_HIGHLIGHT_4: Secondary.B50

    # Colors for occurrences from find widget
    COLOR_OCCURRENCE_1: Primary.B10
    COLOR_OCCURRENCE_2: Primary.B20
    COLOR_OCCURRENCE_3: Primary.B30
    COLOR_OCCURRENCE_4: Primary.B50
    COLOR_OCCURRENCE_5: Primary.B80

    # Editor colors
    EDITOR_BACKGROUND: Primary.B10
    EDITOR_CURRENTLINE: Syntax.B10
    EDITOR_CURRENTCELL: Syntax.B20
    EDITOR_OCCURRENCE: Syntax.B30
    EDITOR_CTRLCLICK: Syntax.B40
    EDITOR_SIDEAREAS: Syntax.B50
    EDITOR_MATCHED_P: Syntax.B60
    EDITOR_UNMATCHED_P: Syntax.B70
    EDITOR_NORMAL: [Primary.B130, false, false]
    EDITOR_KEYWORD: [Syntax.B90, false, false]
    EDITOR_MAGIC: [Syntax.B100, false, false]
    EDITOR_BUILTIN: [Syntax.B110, false, false]
    EDITOR_DEFINITION: [Syntax.B120, true, false]
    EDITOR_COMMENT: [Syntax.B130, false, false]
    EDITOR_STRING: [Syntax.B140, false, true]
    EDITOR_NUMBER: [Syntax.B150, false, false]
    EDITOR_INSTANCE: [Syntax.B160, false, true]
    EDITOR_SYMBOL: [Syntax.B170, false, false]

    # Optional Python roles: reuse local intent where no native distinction exists.
    EDITOR_OPERATOR: [Syntax.B170, false, false]
    EDITOR_WORD_OPERATOR: [Syntax.B90, false, false]
    EDITOR_PUNCTUATION: [Primary.B130, false, false]
    EDITOR_SEPARATOR: [Primary.B130, false, false]
    EDITOR_CLASS: [Syntax.B120, true, false]
    EDITOR_FUNCTION_CALL: [Primary.B130, false, false]
    EDITOR_DOCSTRING: [Syntax.B140, false, true]
    EDITOR_TYPE: [Syntax.B110, false, false]
    EDITOR_BASECLASS: [Syntax.B120, true, false]
    EDITOR_STORAGE: [Syntax.B90, false, false]
    EDITOR_CONSTANT: [Syntax.B90, false, false]
    EDITOR_VARIABLE: [Primary.B130, false, false]
    EDITOR_PARAMETER: [Primary.B130, false, false]
    EDITOR_CLASS_REFERENCE: [Syntax.B120, true, false]
    EDITOR_BRACKET_1: [Primary.B130, false, false]
    EDITOR_BRACKET_2: [Primary.B130, false, false]
    EDITOR_BRACKET_3: [Primary.B130, false, false]
    EDITOR_BRACKET_4: [Primary.B130, false, false]
    EDITOR_BRACKET_5: [Primary.B130, false, false]
    EDITOR_BRACKET_6: [Primary.B130, false, false]

    # Colors for Spyder and Python logos
    PYTHON_LOGO_UP: Logos.B10
    PYTHON_LOGO_DOWN: Logos.B20
    SPYDER_LOGO_BACKGROUND: Primary.B20
    SPYDER_LOGO_WEB: Primary.B140
    SPYDER_LOGO_SNAKE: Primary.B140

    # For special tabs
    SPECIAL_TABS_SEPARATOR: Primary.B70
    SPECIAL_TABS_SELECTED: Secondary.B40

    # For the heart used to ask for donations
    COLOR_HEART: Secondary.B80

    # For editor tooltips
    TIP_TITLE_COLOR: Success.B80
    TIP_CHAR_HIGHLIGHT_COLOR: Syntax.B170

    # Tooltip opacity (numeric value, not a color reference)
    OPACITY_TOOLTIP: 230
  light:
    # Background colors
    COLOR_BACKGROUND_1: Primary.B140
    COLOR_BACKGROUND_2: Primary.B130
    COLOR_BACKGROUND_3: Primary.B120
    COLOR_BACKGROUND_4: Primary.B110
    COLOR_BACKGROUND_5: Primary.B100
    COLOR_BACKGROUND_6: Primary.B90

    # Text colors
    COLOR_TEXT_1: Primary.B10
    COLOR_TEXT_2: Primary.B20
    COLOR_TEXT_3: Primary.B50
    COLOR_TEXT_4: Primary.B70

    # Accent colors
    COLOR_ACCENT_1: Secondary.B130
    COLOR_ACCENT_2: Secondary.B100
    COLOR_ACCENT_3: Secondary.B90
    COLOR_ACCENT_4: Secondary.B80
    COLOR_ACCENT_5: Secondary.B70

    # Disabled elements
    COLOR_DISABLED: Primary.B80
    COLOR_EMPTY: Secondary.B80

    # Explicit Spyder chrome roles preserve the local palette (inner 3px accent).
    COLOR_TOOLBAR_BACKGROUND: Primary.B110
    COLOR_EDITOR_LINE_NUMBER: OptionalUi.B10
    COLOR_STATUSBAR_BACKGROUND: Primary.B110
    COLOR_STATUSBAR_TEXT: Primary.B10
    COLOR_TAB_TEXT: Primary.B10
    COLOR_TAB_SELECTED_TEXT: Primary.B10
    COLOR_TAB_SELECTED_BACKGROUND: Secondary.B70
    COLOR_TAB_SELECTED_ACCENT: Secondary.B80
    COLOR_TAB_HOVER_BACKGROUND: Primary.B100
    COLOR_TREE_TEXT: Primary.B10
    COLOR_TREE_HOVER_BACKGROUND: Primary.B120
    COLOR_TREE_SELECTED_BACKGROUND: Secondary.B100
    COLOR_TREE_SELECTED_TEXT: Primary.B10
    COLOR_TREE_INACTIVE_SELECTION_BACKGROUND: Primary.B120
    COLOR_TREE_INACTIVE_SELECTION_TEXT: Primary.B10
    TAB_SELECTED_ACCENT_INNER_EDGE: 1
    TAB_SELECTED_ACCENT_WIDTH: 3

    # Colors for information and feedback in dialogs
    COLOR_SUCCESS_1: Success.B40
    COLOR_SUCCESS_2: Success.B70
    COLOR_SUCCESS_3: Success.B30
    COLOR_SUCCESS_4: Success.B20
    COLOR_SUCCESS_5: Success.B50
    COLOR_ERROR_1: Error.B40
    COLOR_ERROR_2: Error.B70
    COLOR_ERROR_3: Error.B110
    COLOR_ERROR_4: Error.B120
    COLOR_ERROR_5: Error.B130
    COLOR_WARN_1: Warning.B40
    COLOR_WARN_2: Warning.B70
    COLOR_WARN_3: Warning.B50
    COLOR_WARN_4: Warning.B30
    COLOR_WARN_5: Warning.B10

    # Icon colors
    ICON_1: Primary.B30
    ICON_2: Secondary.B50
    ICON_3: Success.B30
    ICON_4: Error.B70
    ICON_5: Warning.B70
    ICON_6: Primary.B120
    ICON_7: Tertiary.B80

    # Colors for icons and variable explorer
    GROUP_1: GroupLight.B10
    GROUP_2: GroupLight.B20
    GROUP_3: GroupLight.B30
    GROUP_4: GroupLight.B40
    GROUP_5: GroupLight.B50
    GROUP_6: GroupLight.B60
    GROUP_7: GroupLight.B70
    GROUP_8: GroupLight.B80
    GROUP_9: GroupLight.B90
    GROUP_10: GroupLight.B100
    GROUP_11: GroupLight.B110
    GROUP_12: GroupLight.B120

    # Colors for highlight in editor
    COLOR_HIGHLIGHT_1: Secondary.B140
    COLOR_HIGHLIGHT_2: Secondary.B130
    COLOR_HIGHLIGHT_3: Secondary.B120
    COLOR_HIGHLIGHT_4: Secondary.B110

    # Colors for occurrences from find widget
    COLOR_OCCURRENCE_1: Primary.B120
    COLOR_OCCURRENCE_2: Primary.B110
    COLOR_OCCURRENCE_3: Primary.B100
    COLOR_OCCURRENCE_4: Primary.B90
    COLOR_OCCURRENCE_5: Primary.B60

    # Editor colors
    EDITOR_BACKGROUND: Primary.B140
    EDITOR_CURRENTLINE: SyntaxLight.B10
    EDITOR_CURRENTCELL: SyntaxLight.B20
    EDITOR_OCCURRENCE: SyntaxLight.B30
    EDITOR_CTRLCLICK: SyntaxLight.B40
    EDITOR_SIDEAREAS: SyntaxLight.B50
    EDITOR_MATCHED_P: SyntaxLight.B60
    EDITOR_UNMATCHED_P: SyntaxLight.B70
    EDITOR_NORMAL: [Primary.B10, false, false]
    EDITOR_KEYWORD: [SyntaxLight.B90, false, false]
    EDITOR_MAGIC: [SyntaxLight.B100, false, false]
    EDITOR_BUILTIN: [SyntaxLight.B110, false, false]
    EDITOR_DEFINITION: [SyntaxLight.B120, true, false]
    EDITOR_COMMENT: [SyntaxLight.B130, false, true]
    EDITOR_STRING: [SyntaxLight.B140, false, false]
    EDITOR_NUMBER: [SyntaxLight.B150, false, false]
    EDITOR_INSTANCE: [SyntaxLight.B160, false, true]
    EDITOR_SYMBOL: [SyntaxLight.B170, false, false]

    # Optional Python roles: reuse local intent where no native distinction exists.
    EDITOR_OPERATOR: [SyntaxLight.B170, false, false]
    EDITOR_WORD_OPERATOR: [SyntaxLight.B90, false, false]
    EDITOR_PUNCTUATION: [Primary.B10, false, false]
    EDITOR_SEPARATOR: [Primary.B10, false, false]
    EDITOR_CLASS: [SyntaxLight.B120, true, false]
    EDITOR_FUNCTION_CALL: [Primary.B10, false, false]
    EDITOR_DOCSTRING: [SyntaxLight.B140, false, false]
    EDITOR_TYPE: [SyntaxLight.B110, false, false]
    EDITOR_BASECLASS: [SyntaxLight.B120, true, false]
    EDITOR_STORAGE: [SyntaxLight.B90, false, false]
    EDITOR_CONSTANT: [SyntaxLight.B90, false, false]
    EDITOR_VARIABLE: [Primary.B10, false, false]
    EDITOR_PARAMETER: [Primary.B10, false, false]
    EDITOR_CLASS_REFERENCE: [SyntaxLight.B120, true, false]
    EDITOR_BRACKET_1: [Primary.B10, false, false]
    EDITOR_BRACKET_2: [Primary.B10, false, false]
    EDITOR_BRACKET_3: [Primary.B10, false, false]
    EDITOR_BRACKET_4: [Primary.B10, false, false]
    EDITOR_BRACKET_5: [Primary.B10, false, false]
    EDITOR_BRACKET_6: [Primary.B10, false, false]

    # Colors for Spyder and Python logos
    PYTHON_LOGO_UP: Logos.B10
    PYTHON_LOGO_DOWN: Logos.B20
    SPYDER_LOGO_BACKGROUND: Logos.B40
    SPYDER_LOGO_WEB: Logos.B50
    SPYDER_LOGO_SNAKE: Logos.B30

    # For special tabs
    SPECIAL_TABS_SEPARATOR: Primary.B70
    SPECIAL_TABS_SELECTED: Secondary.B70

    # For the heart used to ask for donations
    COLOR_HEART: Error.B70

    # For editor tooltips
    TIP_TITLE_COLOR: Success.B20
    TIP_CHAR_HIGHLIGHT_COLOR: SyntaxLight.B170

    # Tooltip opacity (numeric value, not a color reference)
    OPACITY_TOOLTIP: 230

css_overrides:
  --link-color: 
    dark: COLOR_ACCENT_4
    light: COLOR_ACCENT_5
  --hover-color: 
    dark: COLOR_ACCENT_5
    light: COLOR_ACCENT_4

appeal_overrides:
  --link-color: 
    dark: COLOR_ACCENT_4
    light: COLOR_ACCENT_5
  --hover-color: 
    dark: COLOR_ACCENT_5
    light: COLOR_ACCENT_4

pydoc_overrides:
  --link-color: 
    dark: COLOR_ACCENT_4
    light: COLOR_ACCENT_5
  --hover-color: 
    dark: COLOR_ACCENT_5
    light: COLOR_ACCENT_4
