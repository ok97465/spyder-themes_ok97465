# Native palette shades were resolved by executing the pinned upstream palette/carbonfox.lua and generate_spec with its color/shade library.
# Editor background #161616, foreground #F2F4F8, source syntax shades and neutral UI surfaces are preserved.
# Editor selection shades are locally adapted within the neutral carbon palette.
# Python mappings follow upstream Tree-sitter roles: builtin function/self red, parameter builtin1, generic variable white, type cyan.
# All six bracket depths repeat syn.bracket; the upstream theme does not define a rainbow cycle.
# Default source font styles are plain. Qt-only semantic ramps, current-cell fills and help backgrounds are adaptations.
# Large widget fills, tabs, status bar and selection backgrounds use neutral carbon shades; chromatic colors are confined to syntax, small accents and feedback.
# Editor interaction fills are locally adapted; see EDITOR_COLORS_KO.md.
