# Inactive pane edges: B10 panel, B20 editor, B30 sidebar.
# Qt content frames use neutral bg3; a near-black Vim split is not a borderless Qt-frame instruction.
CarbonfoxPaneBordersDark:
  B10: '#353535'
  B20: '#353535'
  B30: '#353535'

# Qt chrome surfaces: UI-only adaptations of this theme's neutral palette.
# Keep the existing editor/syntax colors; give wide toolbars and idle controls
# their own visible surface. Flat source surfaces are adapted for Qt.
ChromeDark:
  B10: '#292929'  # COLOR_TOOLBAR_BACKGROUND
  B20: '#303030'  # COLOR_TAB_BACKGROUND
  B30: '#353535'  # COLOR_BUTTON_BACKGROUND
  B40: '#454545'  # COLOR_BUTTON_HOVER_BACKGROUND
  B50: '#252525'  # COLOR_BUTTON_PRESSED_BACKGROUND
  B60: '#585858'  # COLOR_BUTTON_BORDER
  B70: '#414141'  # COLOR_TAB_HOVER_BACKGROUND
  B80: '#F2F4F8'  # COLOR_BUTTON_TEXT

# Shared COLOR_ERROR_1: icon foreground and legacy Dependencies cell background.
# Darken the native red/pink only for this Qt role, keeping inherited light
# tree text at 4.5:1 while maximizing the stop icon against the toolbar.
QtErrorDark:
  B10: '#BE4277'

# Qt frame/state adaptations: COLOR_BACKGROUND_4 also draws the local Help
# frame and dock tabs, so its inactive tab shade must remain visible.
# Focus shades retain this palette's hue and readable generic selection text.
# Popup menus and command palettes use independent native roles.
QtUiAuditDark:
  B10: '#353535'  # COLOR_BACKGROUND_4, COLOR_TAB_BACKGROUND
  B30: '#535353'  # COLOR_ACCENT_3

# Reviewed menus and command palette. Native popup colors where the
# reference matches; otherwise this theme's own palette is retained.
# Qt uses opaque fills and 1px popup frames. Switcher titles embed
# COLOR_TEXT_1 in HTML, so selected/input fills may be adjusted for readability.
QtPopupAuditDark:
  B10: '#252525'  # COLOR_MENU_BACKGROUND
  B20: '#F2F4F8'  # COLOR_MENU_TEXT
  B30: '#525253'  # COLOR_MENU_SELECTED_BACKGROUND
  B40: '#F2F4F8'  # COLOR_MENU_SELECTED_TEXT
  B50: '#535353'  # COLOR_MENU_BORDER
  B60: '#252525'  # COLOR_SWITCHER_BACKGROUND
  B70: '#525253'  # COLOR_SWITCHER_SELECTED_BACKGROUND
  B80: '#353535'  # COLOR_SWITCHER_BORDER
  B90: '#252525'  # COLOR_SWITCHER_INPUT_BACKGROUND

# Spyder interaction fills; independently checked in .tools/verify_editor_colors.py.
CarbonfoxEditorStatesDark:
  B10: '#232323'  # EDITOR_CURRENTCELL
  B30: '#525252'  # COLOR_ACCENT_2
  B40: '#7C5E24'  # EDITOR_OCCURRENCE
