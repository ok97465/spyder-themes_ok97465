# Native roles added after the source audit. Native Oceanic/Lighter chrome and two-pixel tab accents; existing readable code-color adaptations are retained.
# UI source: Material-Theme.sublime-theme and Material-Theme-Lighter.sublime-theme
# at the same pinned revision as the schemes above. Both tab_current.png files
# have a two-pixel #80CBC4 stripe at the bottom; tree_highlight.png uses a thin
# teal marker with a transparent interior, so Qt keeps row fills at the base.
# The optional inner-edge and width settings reproduce that native tab stripe.
# Lighter's class/type/parameter/variable/docstring slots inherit the established
# readable gold/orange/normal/comment adaptations rather than reintroducing faint
# native colors. UI tab/status/line-number shades retain the original values.
# SHA-256 Material-Theme.tmTheme: 05b47ba7987293c902cf3528f4aeea833255943ae38932410b1ad5193a2c8424
# SHA-256 Material-Theme-Lighter.tmTheme: 96c08aca4fa51f360e8f9cd175dd97832158e18f8ed0e81d5eec2b02152290b2
