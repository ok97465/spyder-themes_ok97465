# Generic Qt text remains adapted for readable variable-explorer cells.
# Tree text and inactive selection labels now have separate native UI roles.
# Python word operators follow keyword.operator (Ayu/Material) or @keyword.operator (Tokyo Night).
# Sublime Python class-name scopes uppercase constructor references as
# support.class.python, which keeps the class/type gold inside meta.function-call.

# The native String/Symbols/Inherited-Class rule also colors Python base classes
# green; Lighter inherits the established readable string-green adaptation.
