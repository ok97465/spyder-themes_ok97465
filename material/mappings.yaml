  --syn-operator:
    dark: EDITOR_OPERATOR
    light: EDITOR_OPERATOR
  --header-bg-color:
    dark: HelpDark.B10
    light: HelpLight.B10
  --header-text-color:
    dark: HelpDark.B20
    light: HelpLight.B20
  --syn-error-bg:
    dark: HelpDark.B30
