---
# Sublime Text Material Theme by Mattia Astorino (MIT).
# Upstream mirror (linked by Sublime Text Package Control):
# https://github.com/SublimeText/material-theme/blob/134916bde95a275f56fa1808586baeaf0be28ab9/schemes/Material-Theme.tmTheme
# https://github.com/SublimeText/material-theme/blob/134916bde95a275f56fa1808586baeaf0be28ab9/schemes/Material-Theme-Lighter.tmTheme
# Dark uses the original default/Oceanic palette; light uses Lighter.
# The UI ramps and Spyder-only slots are adaptations. Upstream translucent
# line/selection highlights are composited over the editor background.
# Comments and Lighter's normal/string/number/operator colors are darkened or
# lightened where necessary for readable Spyder text, retaining the source hues.
color_classes:
  NativeUiDark: MaterialNativeUiDark
  PythonDark: MaterialPythonDark
  NativeUiLight: MaterialNativeUiLight
  PythonLight: MaterialPythonLight
  HelpDark: MaterialHelpDark
  HelpLight: MaterialHelpLight
  Primary: MaterialSurface
  Secondary: MaterialTeal
  Tertiary: MaterialBlue
  Quaternary: MaterialCyan
  Success: MaterialGreen
  Error: MaterialRed
  Warning: MaterialYellow
  SurfaceLight: MaterialLightSurface
  AccentLight: MaterialLightTeal
  AccentFillDark: MaterialAccentFillDark
  AccentFillLight: MaterialAccentFillLight
  SuccessLight: MaterialLightGreen
  ErrorLight: MaterialLightRed
  WarningLight: MaterialLightYellow
  GroupDark: MaterialGroupDark
  GroupLight: MaterialGroupLight
  Syntax: MaterialSyntaxDark
  SyntaxLight: MaterialSyntaxLight
  Logos: Logos
semantic_mappings:
  dark:
    COLOR_BACKGROUND_1: Primary.B10
    COLOR_BACKGROUND_2: Primary.B20
    COLOR_BACKGROUND_3: Primary.B30
