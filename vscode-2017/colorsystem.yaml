# Adapted from Microsoft VS Code 1.19.1 (2017-12-19), Dark+ / Light+ (MIT).
# Upstream revision: 0759f77bb8d86658bc935a10a64f6182c5a1eeba
# https://github.com/microsoft/vscode/tree/0759f77bb8d86658bc935a10a64f6182c5a1eeba/extensions/theme-defaults/themes
# UI defaults also come from the same revision of:
# src/vs/platform/theme/common/colorRegistry.ts
# src/vs/workbench/common/theme.ts
# src/vs/editor/common/view/editorColorRegistry.ts
# Qt intermediate shades, status ramps and opaque alpha composites are adapted.
# Light warning text uses #8A7000 instead of native #B89500 for readability.
# Syntax slots B10..B170 follow catppuccin-mocha; B190..B220 are selections.
# Python colors were checked with the pinned MagicPython grammar and
# VS Code TextMate selector precedence, not generic palette-name guesses.
# Native 2017 has no semantic highlighting: ordinary variables, generic calls
# and constructor references retain editor foreground; declared parameters use
# variable.parameter, and class declarations/base names use the type color.
# Logical word operators use keyword.operator.logical.python, not control color.
# All bracket-depth slots retain native punctuation: 2017 has no rainbow default.
# Native chrome defaults: workbench/common/theme.ts and platform/theme/common/
# colorRegistry.ts at the pinned revision; gutter from editorColorRegistry.ts.
# Half-alpha inactive tab labels are flattened over each inactive tab background.
# Current-line border colors become fills because Spyder exposes only a fill.
# Selection/occurrence/bracket fills use native opaque colors or native alpha
# flattened over editor.background. Current-cell/unmatched fills adapt Qt-only
# states; the shared accent uses native status/badge blue #007ACC. Group fills
# and generic Qt widget accents are adapted for Spyder's shared palette slots.
# Strict contrast checks can flag native syntax, subtle bracket fills, widget
# borders and text-role ordering; retain native colors instead of brightening.
