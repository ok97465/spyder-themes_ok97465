# Adapted from Binaryify/OneDark-Pro (MIT).
# Upstream revision: 75c80ab18d90655e05ad837bb8d89f5e68d5ce53
# https://github.com/Binaryify/OneDark-Pro/blob/75c80ab18d90655e05ad837bb8d89f5e68d5ce53/themes/OneDark-Pro.json
# Native editor, syntax and widget colors are preserved where slots match.
# Qt-only intermediate shades, status ramps and opaque overlays are adapted.
# Source JSON SHA-256: bd098a63d2fdcb932ea67caaf66eb25a51cda1c2179ff37048fe1db7fe13461f
# Editor RGBA overlays are flattened over the editor; list/tab alpha colors
# are flattened over their native sidebar/tab backgrounds for Qt.
# Python colors follow VS Code semantic fallback scopes: class.defaultLibrary
# probes support.class (yellow), while parameter probes variable.parameter
# (variable red plus the native italic-only parameter rule). TextMate-only
# support.type.python would be cyan and variable.parameter.function.python orange.
# Comments and self/cls are italic, and none of these Python roles are bold.
# Python keyword.operator.logical.python overrides generic cyan operator rules
# with purple for and/or/not/in/is; symbolic operators remain cyan.
# Native One Dark Pro supplies three bracket colors; all three are preserved.
# tab.activeBorder is a native 1px inner gray edge (#B4B4B4); the numeric
# TAB_SELECTED_ACCENT_INNER_EDGE role preserves its position instead of adding a top line.
# Qt feedback shade ramps and help fills remain explicit adaptations.
# Variable-explorer group fills are darkened adaptations so native #ABB2BF labels
# remain readable after Spyder overlays those fills at 50% on the sidebar.
