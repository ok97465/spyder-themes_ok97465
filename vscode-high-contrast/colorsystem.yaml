# Adapted from Microsoft VS Code High Contrast Dark / Light (MIT).
# Installed source: VS Code 1.146.0, commit 69047191fc427f2f92828279aae1d90d8eeda7ab.
# https://github.com/microsoft/vscode/blob/69047191fc427f2f92828279aae1d90d8eeda7ab/extensions/theme-defaults/themes/hc_black.json
# https://github.com/microsoft/vscode/blob/69047191fc427f2f92828279aae1d90d8eeda7ab/extensions/theme-defaults/themes/hc_light.json
# UI defaults were resolved from workbench.desktop.main.js and modern tab CSS,
# then visually checked in the installed app (both themes).
# Native: editor/syntax, toolbar/status backgrounds, primary button/text/border,
# pane/editor/sidebar contrastBorder, focusBorder and bracket depth colors.
# Qt adaptations (no Spyder code changes):
# - Inactive tabs and COLOR_BACKGROUND_4 share gray / muted blue-gray so the
#   legacy Help border stays visible. Tab text uses full native foreground,
#   not modern UI's 50%-alpha inactive label (#808080 / #949494).
# - Selected tabs use a 2px native focus-color accent instead of VS Code's
#   connected outline; Light classic red activeBorderTop is not used.
# - Current line/cell, occurrences, selections and bracket matches need
#   readable opaque fills: Spyder has no independent native outline/text slots.
# - Tree selections and button/toolbar pressed fills are adapted for Qt.
# - Light HC semanticHighlighting defaults off: generic calls, class references
#   and ordinary variables retain #292929. Declarations, parameters and builtins
#   follow MagicPython TextMate scopes; Dark uses semantic fallback colors.
# Generic ramps below only serve fallback asset/CSS generation; all runtime
# semantic roles are explicitly mapped in the variant-specific palettes.
