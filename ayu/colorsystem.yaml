# Generic Qt text remains adapted for readable variable-explorer cells.
# Tree text and inactive selection labels now have separate native UI roles.
# Python word operators follow keyword.operator (Ayu/Material) or @keyword.operator (Tokyo Night).

# Ayu has no bracket-highlight overrides. With VS Code bracket pair coloring
# enabled (the live reference setting), use the verified built-in dark/light
# three-color cycles; absent colors 4..6 repeat that cycle in the Spyder fork.
