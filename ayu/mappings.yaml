# Ayu Dark and Light, adapted to Spyder's semantic slots.
# Official palette: https://github.com/ayu-theme/ayu-colors/tree/d461f02983546636bc6e1e0c48190fdb74036426/themes
# Resolved colors: https://github.com/ayu-theme/vscode-ayu/tree/7f438df22446f02e79cdfc2f3771b0b273f34654
# Sources: ayu-dark.json and ayu-light.json; upstream MIT notices in LICENSE.
# Named surface and syntax colors preserve upstream values. Extra widget shades
# are RGB blends; translucent editor highlights are flattened over editor.bg.
---
color_classes:
  NativeUiDark: AyuNativeUiDark
  PythonDark: AyuPythonDark
  NativeUiLight: AyuNativeUiLight
  PythonLight: AyuPythonLight
  HelpDark: AyuHelpDark
  HelpLight: AyuHelpLight
  Primary: AyuNeutral
  Secondary: AyuAccentDark
  SecondaryLight: AyuAccentLight
  UiFillDark: AyuUiFillDark
  UiFillLight: AyuUiFillLight
  Tertiary: AyuBlue
  Quaternary: AyuCyan
  Success: AyuGreen
  Error: AyuRed
  Warning: AyuYellow
  SurfaceDark: AyuSurfaceDark
  SurfaceLight: AyuSurfaceLight
  GroupDark: AyuGroupDark
  GroupLight: AyuGroupLight
  Syntax: AyuSyntaxDark
  SyntaxLight: AyuSyntaxLight
  Logos: Logos
