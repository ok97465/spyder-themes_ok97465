# override the later generic 2026 support/constant/keyword/entity colors.
# Python TextMate output was checked with the pinned MagicPython grammar.
# Contextual calls/classes/variables/parameters use semantic fallback probes
# from src/vs/platform/theme/common/tokenClassificationRegistry.ts: function ->
# entity.name.function, class -> entity.name.type.class, variable ->
# variable.other.readwrite, parameter -> variable.parameter. No external LSP
# inference is provided by this port. Native body self/cls use variable.language.
# Bracket colors and enabled-by-default depth cycling come from the pinned
# editorColorRegistry.ts and core/misc/textModelDefaults.ts.
# Sidebar/tab/status/gutter colors come directly from the 2026 JSON; alpha
# tree selections are flattened over sideBar.background for Qt.
# Variable Explorer group fills have no upstream equivalent: native hues are
# blended 60% over the sidebar before Spyder applies its own cell overlay.
