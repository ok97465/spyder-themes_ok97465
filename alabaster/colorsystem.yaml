# Inactive pane edges: B10 panel, B20 editor, B30 sidebar.
# Qt content frames use an existing neutral gray; a native focus color is not an inactive-frame specification.
AlabasterPaneBordersLight:
  B10: '#BBBBBB'
  B20: '#BBBBBB'
  B30: '#BBBBBB'

# Qt chrome surfaces: UI-only adaptations of this theme's neutral palette.
# Keep the existing editor/syntax colors; give wide toolbars and idle controls
# their own visible surface. Flat source surfaces are adapted for Qt.
ChromeLight:
  B10: '#E0E0E0'  # COLOR_TOOLBAR_BACKGROUND
  B20: '#DDDDDD'  # COLOR_TAB_BACKGROUND
  B30: '#DDDDDD'  # COLOR_BUTTON_BACKGROUND
  B40: '#CDCDCD'  # COLOR_BUTTON_HOVER_BACKGROUND
  B50: '#BEBEBE'  # COLOR_BUTTON_PRESSED_BACKGROUND
  B60: '#BBBBBB'  # COLOR_BUTTON_BORDER
  B70: '#E8E8E8'  # COLOR_TAB_HOVER_BACKGROUND
  B80: '#000000'  # COLOR_BUTTON_TEXT

# Qt frame/state adaptations: COLOR_BACKGROUND_4 also draws the local Help
# frame and dock tabs, so its inactive tab shade must remain visible.
# Focus shades retain this palette's hue and readable generic selection text.
# Popup menus and command palettes use independent native roles.
QtUiAuditLight:
  B10: '#CCCCCC'  # COLOR_BACKGROUND_4, COLOR_TAB_BACKGROUND
  B30: '#007ACC'  # COLOR_ACCENT_3

# Reviewed menus and command palette. Native popup colors where the
# reference matches; otherwise this theme's own palette is retained.
# Qt uses opaque fills and 1px popup frames. Switcher titles embed
# COLOR_TEXT_1 in HTML, so selected/input fills may be adjusted for readability.
QtPopupAuditLight:
  B10: '#FFFFFF'  # COLOR_MENU_BACKGROUND
  B20: '#616161'  # COLOR_MENU_TEXT
  B30: '#DDDDDD'  # COLOR_MENU_SELECTED_BACKGROUND
  B40: '#000000'  # COLOR_MENU_SELECTED_TEXT
  B50: '#FFFFFF'  # COLOR_MENU_BORDER
  B60: '#F3F3F3'  # COLOR_SWITCHER_BACKGROUND
  B70: '#DDDDDD'  # COLOR_SWITCHER_SELECTED_BACKGROUND
  B80: '#BBBBBB'  # COLOR_SWITCHER_BORDER
  B90: '#FFFFFF'  # COLOR_SWITCHER_INPUT_BACKGROUND

# Spyder interaction fills; independently checked in .tools/verify_editor_colors.py.
AlabasterEditorStatesLight:
  B10: '#E5E5E5'  # EDITOR_CURRENTCELL
  B20: '#D3D3D3'  # EDITOR_CURRENTLINE
  B30: '#B0B0B0'  # COLOR_ACCENT_2
  B40: '#F4D29F'  # EDITOR_OCCURRENCE
