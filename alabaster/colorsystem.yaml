# Source: https://github.com/tonsky/vscode-theme-alabaster/blob/7e8e48c0f33022cd3cf5fec0114c307d63663e39/theme/alabaster-color-theme.json
# Original light theme only. Editor background #F7F7F7 and the four main syntax highlight classes are preserved.
# Comments red, strings green, constants purple, entity definitions blue; keywords/builtins/variables stay black.
# Punctuation and all six bracket roles inherit original punctuation gray; no added rainbow or font variations.
# All formatted syntax roles are regular. Unsupported semantic distinctions fall back to black.
# Qt selections follow the neutral list palette; the editor state audit locally adapts their shades.
# Source selection alpha is flattened over editor.background before local state adaptations. Extra gray widget shades are Qt adaptations.
# Qt gutter labels use original punctuation/bright-black #777777 instead of native #9DA39A for at least 3:1 contrast.
# Editor interaction fills are locally adapted; see EDITOR_COLORS_KO.md.
