# Native VS Code editor backgrounds, normal foregrounds, syntax colors and neutral UI surfaces are preserved.
# Alpha selections are composited over the native editor background for opaque Qt colors.
# The native gutter colors are intentionally faint; line numbers use the upstream comment color for legibility.
# Qt tab labels use the native normal foreground so hover text remains at least 4.5:1; backgrounds are unchanged.
# All six bracket depths repeat native punctuation; the upstream theme has no rainbow bracket cycle.
# Python classes follow entity.name.type.class; builtin types and legacy names use the later support.type.python / variable.legacy.builtin.python cyan rule.
# Builtin functions retain the native orange bold support.function rule.
# Python self/cls and inherited-class scopes retain the native normal foreground.
# Qt-only semantic feedback ramps, current-cell shading and help fills are explicit adaptations.
# Large widget fills and selections remain neutral; source accent colors are used for small accents and foregrounds.
