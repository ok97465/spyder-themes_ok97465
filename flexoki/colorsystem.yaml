  B10: '#E6E4D9'  # COLOR_TOOLBAR_BACKGROUND
  B20: '#DAD8CE'  # COLOR_TAB_BACKGROUND
  B30: '#DAD8CE'  # COLOR_BUTTON_BACKGROUND
