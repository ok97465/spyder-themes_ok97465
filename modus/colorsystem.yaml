# Inactive pane edges: B10 panel, B20 editor, B30 sidebar.
# Native vertical-border/window-divider neutral, separate from the unchanged widget surfaces.
ModusPaneBordersDark:
  B10: '#646464'
  B20: '#646464'
  B30: '#646464'
# Native vertical-border/window-divider neutral, separate from the unchanged widget surfaces.
ModusPaneBordersLight:
  B10: '#9F9F9F'
  B20: '#9F9F9F'
  B30: '#9F9F9F'

# Qt chrome surfaces: UI-only adaptations of this theme's neutral palette.
# Keep the existing editor/syntax colors; give wide toolbars and idle controls
# their own visible surface. Flat source surfaces are adapted for Qt.
ChromeDark:
  B10: '#303030'  # COLOR_TOOLBAR_BACKGROUND
  B20: '#313131'  # COLOR_TAB_BACKGROUND
  B30: '#313131'  # COLOR_BUTTON_BACKGROUND
  B40: '#535353'  # COLOR_BUTTON_HOVER_BACKGROUND
  B50: '#1E1E1E'  # COLOR_BUTTON_PRESSED_BACKGROUND
  B60: '#646464'  # COLOR_BUTTON_BORDER
  B70: '#404040'  # COLOR_TAB_HOVER_BACKGROUND
  B80: '#FFFFFF'  # COLOR_BUTTON_TEXT

# Qt chrome surfaces: UI-only adaptations of this theme's neutral palette.
# Keep the existing editor/syntax colors; give wide toolbars and idle controls
# their own visible surface. Flat source surfaces are adapted for Qt.
ChromeLight:
  B10: '#DCDCDC'  # COLOR_TOOLBAR_BACKGROUND
  B20: '#DFDFDF'  # COLOR_TAB_BACKGROUND
  B30: '#DFDFDF'  # COLOR_BUTTON_BACKGROUND
  B40: '#C4C4C4'  # COLOR_BUTTON_HOVER_BACKGROUND
  B50: '#B8B8B8'  # COLOR_BUTTON_PRESSED_BACKGROUND
  B60: '#9F9F9F'  # COLOR_BUTTON_BORDER
  B70: '#CCCCCC'  # COLOR_TAB_HOVER_BACKGROUND
  B80: '#000000'  # COLOR_BUTTON_TEXT

# Qt frame/state adaptations: COLOR_BACKGROUND_4 also draws the local Help
# frame and dock tabs, so its inactive tab shade must remain visible.
# Focus shades retain this palette's hue and readable generic selection text.
# Popup menus and command palettes use independent native roles.
QtUiAuditDark:
  B10: '#404040'  # COLOR_BACKGROUND_4, COLOR_TAB_BACKGROUND
  B20: '#535353'  # COLOR_TAB_HOVER_BACKGROUND
  B30: '#646464'  # COLOR_ACCENT_3
QtUiAuditLight:
  B10: '#CCCCCC'  # COLOR_BACKGROUND_4, COLOR_TAB_BACKGROUND
  B20: '#BDBDBD'  # COLOR_TAB_HOVER_BACKGROUND
  B30: '#9F9F9F'  # COLOR_ACCENT_3

# Reviewed menus and command palette. Native popup colors where the
# reference matches; otherwise this theme's own palette is retained.
# Qt uses opaque fills and 1px popup frames. Switcher titles embed
# COLOR_TEXT_1 in HTML, so selected/input fills may be adjusted for readability.
QtPopupAuditDark:
  B10: '#1E1E1E'  # COLOR_MENU_BACKGROUND
  B20: '#FFFFFF'  # COLOR_MENU_TEXT
  B30: '#45605E'  # COLOR_MENU_SELECTED_BACKGROUND
  B40: '#FFFFFF'  # COLOR_MENU_SELECTED_TEXT
  B50: '#646464'  # COLOR_MENU_BORDER
  B60: '#1E1E1E'  # COLOR_SWITCHER_BACKGROUND
  B70: '#45605E'  # COLOR_SWITCHER_SELECTED_BACKGROUND
  B80: '#646464'  # COLOR_SWITCHER_BORDER
  B90: '#303030'  # COLOR_SWITCHER_INPUT_BACKGROUND

QtPopupAuditLight:
  B10: '#F2F2F2'  # COLOR_MENU_BACKGROUND
  B20: '#000000'  # COLOR_MENU_TEXT
  B30: '#B2E4DC'  # COLOR_MENU_SELECTED_BACKGROUND
  B40: '#000000'  # COLOR_MENU_SELECTED_TEXT
  B50: '#9F9F9F'  # COLOR_MENU_BORDER
  B60: '#F2F2F2'  # COLOR_SWITCHER_BACKGROUND
  B70: '#B2E4DC'  # COLOR_SWITCHER_SELECTED_BACKGROUND
  B80: '#9F9F9F'  # COLOR_SWITCHER_BORDER
  B90: '#E0E0E0'  # COLOR_SWITCHER_INPUT_BACKGROUND

