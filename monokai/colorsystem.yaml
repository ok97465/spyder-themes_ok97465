# and Adaptive.sublime-theme. Source attribution/checksums are in LICENSE.
# HSL colors are converted to opaque #RRGGBB, not sampled from screenshots.
# Adaptive file_medium_dark: sidebar/tabset = editor * .6; status = editor * .5.
# SurfaceDark slots describe widget roles, not an increasing brightness ramp:
# B10 editor/selected tab; B20 sidebar; B40 toolbar/inactive tab; B50 selected tab.
# B120 is the native status/output-panel fill. Generic Spyder widgets share slots.
