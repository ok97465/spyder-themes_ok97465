# PaperColor: official source colors adapted to Spyder.
# Upstream author: Nikyle Nguyen. License: MIT (notice in LICENSE).
# Upstream revision: 0cfe64ffb24c21a6101b5f994ca342a74c977aef
# Source: https://github.com/NLKNguyen/papercolor-theme/blob/0cfe64ffb24c21a6101b5f994ca342a74c977aef/colors/PaperColor.vim
# Original editor backgrounds, foregrounds, gutter backgrounds and Python syntax anchors are preserved.
# Qt gutter labels use the upstream neutral comment foreground (#808080 dark / #878787 light) for at least 3:1 contrast.
# Python keyword collapses to pythonStatement; definition uses pythonFunction; symbolic operators use generic Operator.
# Word operators use pythonOperator (bold); comments retain upstream italics; builtin highlighting uses upstream default off.
# Storage def/class follows pythonStatement; builtin types follow default pythonBuiltin; boolean constants follow pythonBoolean (bold).
# Class definitions share the definition color; calls/parameters/references fall back to foreground where Vim has no distinction.
# No native rainbow brackets: all six roles explicitly inherit Delimiter (aqua).
# Qt bars/tabs/tree selections use neutral gray adaptations instead of the saturated terminal status/tab colors.
# Dark selection remains gray; light editor selection uses a blue tint. Normal foreground is retained.
# Help feedback fills are 8% RGB composites.
# Editor interaction fills are locally adapted; see EDITOR_COLORS_KO.md.
---
