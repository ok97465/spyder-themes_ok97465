# Inactive pane edges: B10 panel, B20 editor, B30 sidebar.
# Spyder neutral adaptation of native colored splits, consistent with the existing neutral Qt UI.
PapercolorPaneBordersDark:
  B10: '#585858'
  B20: '#585858'
  B30: '#585858'
# Spyder neutral adaptation of native colored splits, consistent with the existing neutral Qt UI.
PapercolorPaneBordersLight:
  B10: '#BCBCBC'
  B20: '#BCBCBC'
  B30: '#BCBCBC'

# Qt chrome surfaces: UI-only adaptations of this theme's neutral palette.
# Keep the existing editor/syntax colors; give wide toolbars and idle controls
# their own visible surface. Flat source surfaces are adapted for Qt.
ChromeDark:
  B10: '#3A3A3A'  # COLOR_TOOLBAR_BACKGROUND
  B20: '#3A3A3A'  # COLOR_TAB_BACKGROUND
  B30: '#444444'  # COLOR_BUTTON_BACKGROUND
  B40: '#585858'  # COLOR_BUTTON_HOVER_BACKGROUND
  B50: '#303030'  # COLOR_BUTTON_PRESSED_BACKGROUND
  B60: '#707070'  # COLOR_BUTTON_BORDER
  B70: '#494949'  # COLOR_TAB_HOVER_BACKGROUND
  B80: '#D0D0D0'  # COLOR_BUTTON_TEXT

# Qt chrome surfaces: UI-only adaptations of this theme's neutral palette.
# Keep the existing editor/syntax colors; give wide toolbars and idle controls
# their own visible surface. Flat source surfaces are adapted for Qt.
ChromeLight:
  B10: '#D0D0D0'  # COLOR_TOOLBAR_BACKGROUND
  B20: '#D0D0D0'  # COLOR_TAB_BACKGROUND
  B30: '#D0D0D0'  # COLOR_BUTTON_BACKGROUND
  B40: '#BCBCBC'  # COLOR_BUTTON_HOVER_BACKGROUND
  B50: '#AFAFAF'  # COLOR_BUTTON_PRESSED_BACKGROUND
  B60: '#A0A0A0'  # COLOR_BUTTON_BORDER
  B70: '#DCDCDC'  # COLOR_TAB_HOVER_BACKGROUND
  B80: '#303030'  # COLOR_BUTTON_TEXT

# Qt frame/state adaptations: COLOR_BACKGROUND_4 also draws the local Help
# frame and dock tabs, so its inactive tab shade must remain visible.
# Focus shades retain this palette's hue and readable generic selection text.
# Popup menus and command palettes use independent native roles.
QtUiAuditDark:
  B10: '#3E3E3E'  # COLOR_BACKGROUND_4, COLOR_TAB_BACKGROUND
  B30: '#355B63'  # COLOR_ACCENT_3
QtUiAuditLight:
  B10: '#BCBCBC'  # COLOR_BACKGROUND_4, COLOR_TAB_BACKGROUND
  B30: '#B1B1B1'  # COLOR_ACCENT_3

# Reviewed menus and command palette. Native popup colors where the
# reference matches; otherwise this theme's own palette is retained.
# Qt uses opaque fills and 1px popup frames. Switcher titles embed
# COLOR_TEXT_1 in HTML, so selected/input fills may be adjusted for readability.
