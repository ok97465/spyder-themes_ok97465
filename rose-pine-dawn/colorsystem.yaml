# Qt chrome surfaces: UI-only adaptations of this theme's neutral palette.
# Keep the existing editor/syntax colors; give wide toolbars and idle controls
# their own visible surface. Flat source surfaces are adapted for Qt.
ChromeLight:
  B10: '#E9E1DD'  # COLOR_TOOLBAR_BACKGROUND
  B20: '#F2E9E1'  # COLOR_TAB_BACKGROUND
  B30: '#E9DFD6'  # COLOR_BUTTON_BACKGROUND
  B40: '#DDD3CC'  # COLOR_BUTTON_HOVER_BACKGROUND
  B50: '#D2C7C2'  # COLOR_BUTTON_PRESSED_BACKGROUND
  B60: '#B8ACAE'  # COLOR_BUTTON_BORDER
  B70: '#E7DDD8'  # COLOR_TAB_HOVER_BACKGROUND
  B80: '#46415F'  # COLOR_BUTTON_TEXT

# Qt frame/state adaptations: COLOR_BACKGROUND_4 also draws the local Help
# frame and dock tabs, so its inactive tab shade must remain visible.
# Focus shades retain this palette's hue and readable generic selection text.
# Popup menus and command palettes use independent native roles.
QtUiAuditLight:
  B30: '#C6D3D4'  # COLOR_ACCENT_3

# Reviewed menus and command palette. Native popup colors where the
# reference matches; otherwise this theme's own palette is retained.
# Qt uses opaque fills and 1px popup frames. Switcher titles embed
# COLOR_TEXT_1 in HTML, so selected/input fills may be adjusted for readability.
QtPopupAuditLight:
  B10: '#FFFAF3'  # COLOR_MENU_BACKGROUND
  B20: '#575279'  # COLOR_MENU_TEXT
  B30: '#F4EFEA'  # COLOR_MENU_SELECTED_BACKGROUND
  B40: '#575279'  # COLOR_MENU_SELECTED_TEXT
  B50: '#F8F3ED'  # COLOR_MENU_BORDER
  B60: '#FFFAF3'  # COLOR_SWITCHER_BACKGROUND
  B70: '#F4EFEA'  # COLOR_SWITCHER_SELECTED_BACKGROUND
  B80: '#F2E9E1'  # COLOR_SWITCHER_BORDER
  B90: '#F9F2EA'  # COLOR_SWITCHER_INPUT_BACKGROUND
