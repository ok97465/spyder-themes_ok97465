css_overrides:
  --border-light: 
    dark: COLOR_HIGHLIGHT_4
    light: Tertiary.B90
  --note-bg: 
    dark: COLOR_HIGHLIGHT_2
    light: Tertiary.B130
  --link-color: 
    dark: Tertiary.B80
    light: Tertiary.B70

appeal_overrides:
  --link-color: 
    dark: Tertiary.B80
    light: Tertiary.B70

pydoc_overrides:
  --link-color: 
    dark: Tertiary.B80
    light: Tertiary.B70
