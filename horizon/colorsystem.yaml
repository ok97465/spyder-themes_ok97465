# Inactive pane edges: B10 panel, B20 editor, B30 sidebar.
# Qt content frames reuse muted slate and warm stone; faint workbench group edges alone do not delimit Qt panes.
HorizonPaneBordersDark:
  B10: '#44475D'
  B20: '#44475D'
  B30: '#44475D'
# Qt content frames reuse muted slate and warm stone; faint workbench group edges alone do not delimit Qt panes.
HorizonPaneBordersLight:
  B10: '#B5AAA6'
  B20: '#B5AAA6'
  B30: '#B5AAA6'


# Interface hierarchy: source colors and Qt-only state adaptations.
# Horizon/Horizon Bright native editor and warm accents are retained.
# Qt toolbar, tabs and buttons use existing neutral/warm-paper surface levels
# rather than the editor background. Bright pressed #CBBDB8 is an extra warm
# neutral adaptation; the other fills reuse this port's established palette.
HorizonInterfaceDark:
  B10: '#292B36'  # toolbar
  B20: '#292B36'  # inactive tab
  B30: '#ADB0B8'  # inactive tab text
  B40: '#343641'  # tab hover
  B50: '#343641'  # button
  B60: '#D5D8DA'  # button text
  B70: '#44475D'  # button hover
  B80: '#292B36'  # button pressed
  B90: '#535563'  # button border
HorizonInterfaceLight:
  B10: '#ECDEDA'  # toolbar
  B20: '#DDCFCA'  # inactive tab
  B30: '#504B4A'  # inactive tab text
  B40: '#ECDEDA'  # tab hover
  B50: '#DDCFCA'  # button
  B60: '#504B4A'  # button text
  B70: '#ECDEDA'  # button hover
  B80: '#CBBDB8'  # button pressed
  B90: '#B5AAA6'  # button border

# Qt frame/state adaptations: COLOR_BACKGROUND_4 also draws the local Help
# frame and dock tabs, so its inactive tab shade must remain visible.
# Focus shades retain this palette's hue and readable generic selection text.
# Popup menus and command palettes use independent native roles.
QtUiAuditDark:
  B10: '#343641'  # COLOR_BACKGROUND_4, COLOR_TAB_BACKGROUND
  B20: '#41434F'  # COLOR_TAB_HOVER_BACKGROUND
  B30: '#65414D'  # COLOR_ACCENT_3
QtUiAuditLight:
  B10: '#CBBDB8'  # COLOR_BACKGROUND_4, COLOR_TAB_BACKGROUND
  B30: '#CEB0B5'  # COLOR_ACCENT_3

# Reviewed menus and command palette. Native popup colors where the
# reference matches; otherwise this theme's own palette is retained.
# Qt uses opaque fills and 1px popup frames. Switcher titles embed
# COLOR_TEXT_1 in HTML, so selected/input fills may be adjusted for readability.
QtPopupAuditDark:
  B10: '#232530'  # COLOR_MENU_BACKGROUND
  B20: '#F0F0F0'  # COLOR_MENU_TEXT
  B30: '#292B37'  # COLOR_MENU_SELECTED_BACKGROUND
  B40: '#D5D8DA'  # COLOR_MENU_SELECTED_TEXT
  B50: '#232530'  # COLOR_MENU_BORDER
  B60: '#232530'  # COLOR_SWITCHER_BACKGROUND
  B70: '#292B37'  # COLOR_SWITCHER_SELECTED_BACKGROUND
  B80: '#44475D'  # COLOR_SWITCHER_BORDER
  B90: '#2E303E'  # COLOR_SWITCHER_INPUT_BACKGROUND

QtPopupAuditLight:
  B10: '#FADAD1'  # COLOR_MENU_BACKGROUND
  B20: '#06060C'  # COLOR_MENU_TEXT
  B30: '#F9D2C7'  # COLOR_MENU_SELECTED_BACKGROUND
  B40: '#06060C'  # COLOR_MENU_SELECTED_TEXT
