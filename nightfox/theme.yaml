# VS Code port of EdenEast/nightfox.nvim; this adaptation follows the VS Code port.
# Native editor background/foreground, syntax, selected-tab, statusbar, pane-border and primary-button colors are retained.
# Python builtin calls use function.defaultLibrary, builtin types use type.defaultLibrary,
# self/cls use variable.defaultLibrary; docstrings use string and comments retain italics.
# All bracket depths use the native Brackets scope; the source has no rainbow colors.
# Generic *.declaration bold is not applied: Spyder cannot limit that flag to semantic declarations.
# Qt adaptations: COLOR_ACCENT_3 uses native blue for focused pane outlines;
# toolbar uses titleBar.activeBackground; inactive tabs/legacy Help frame and tab hover
# are raised within the blue-gray palette, with brighter inactive tab text.
# Button pressed is a 10% blend of native button.background toward titleBar.activeBackground.
# VS Code does not specify quickInput colors: Switcher follows editorWidget/input/list roles.
# Qt feedback/highlight ramps, current-cell tint and help fills adapt the same native palette.
# Qt feedback adaptation: COLOR_ERROR_1 and COLOR_WARN_1 also fill legacy Dependencies cells;
# COLOR_ERROR_1 also colors the stop icon. Darkened same-hue fills and native brightWhite
# tree text retain readable dependency labels while ICON_4/5 keep native red/yellow.
# The shared stop role retains at least 3:1 contrast against the toolbar.
# Editor interaction fills are locally adapted; see EDITOR_COLORS_KO.md.
