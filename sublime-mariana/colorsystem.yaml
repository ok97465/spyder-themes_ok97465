# Palette reference: Sublime Text 4 build 4215 (2026-09-25).
# https://download.sublimetext.com/sublime_text_build_4215_x64.tar.xz
# Mariana.sublime-color-scheme in Packages/Color Scheme - Default.sublime-package
# Adaptive.sublime-theme in Packages/Theme - Default.sublime-package
# Archive SHA-256: c153f418d3ab26b90ecce8c02a82e4e961025ed7a65f7e25060a5457d43e88d9
# Upstream licensing is unspecified; see LICENSE for attribution and source notes.
# Mariana HSL colors are converted to opaque #RRGGBB for Qt.
# blue3 -> background; white3 -> foreground; blue-vibrant -> accent.
# Native line_highlight and selection (blue2 at 70%) flatten to #4D5864.
# Adaptive medium_dark_bg (60% background, 40% black) -> #1D2227 sidebar.
# Adaptive file_medium_dark is used, as in the reference screenshots.
# General widgets use B20 (chrome), independently of B10 (editor).
# B30 = 50% editor background (status/output); B40 = chrome (toolbar/tabs).
# B50 = editor (active tabs); B60 = white at 30% over chrome (icons/scroll).
# Native accent blue is kept for links; tab accents use the editor background.
# Syntax B10..B170 follow the editor slots documented in catppuccin-mocha.
# Optional formatted slots distinguish functions/classes, calls, types, docstrings,
# operators, separators and punctuation in the companion Spyder fork.
# Stock Spyder uses white punctuation and teal definitions as its shared fallback.
# Comments and other editor text retain upstream plain font styles.
# Current cell and bracket fills are adapted; Sublime uses bracket underlines.
# B190..B220 are progressively stronger native selection overlays.
# Group fills blend native hues 60% over the editor background before Spyder's overlay.
# Native editor/selection colors can trigger ThemeWeaver's stricter contrast advisories.
